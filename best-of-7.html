<title>Best of 7</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;800&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a dark arena scoreboard band carries the series; below it a two-column workbench (player pool | lineup card). */
:root {
  --bg: #E7ECF2; --surface: #FFFFFF; --sunk: #F2F5F8; --ink: #13213A; --muted: #5A6980; --line: #D2DAE4;
  --gold: #E0A11A; --a: #1F5FBF; --b: #BF3A2B; --a-soft: #DDE7F7; --b-soft: #F7E2DE; --good: #1C7C50; --bad: #B23A2A;
  --board: #13213A; --board-2: #1B2B48; --board-ink: #F2F5F9; --board-muted: #94A4BC; --board-a: #74A9FF; --board-b: #FF8571;
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1420; --surface: #151F30; --sunk: #111A28; --ink: #E6ECF4; --muted: #95A4BA; --line: #26334A;
  --gold: #F0B738; --a: #6EA4FF; --b: #FF7E69; --a-soft: #1A2B49; --b-soft: #3B201E; --good: #4CC28A; --bad: #FF7E69;
  --board: #070C16; --board-2: #111C30; --board-ink: #F2F5F9; --board-muted: #8E9EB6; --board-a: #74A9FF; --board-b: #FF8571;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0D1420; --surface: #151F30; --sunk: #111A28; --ink: #E6ECF4; --muted: #95A4BA; --line: #26334A;
  --gold: #F0B738; --a: #6EA4FF; --b: #FF7E69; --a-soft: #1A2B49; --b-soft: #3B201E; --good: #4CC28A; --bad: #FF7E69;
  --board: #070C16; --board-2: #111C30; --board-ink: #F2F5F9; --board-muted: #8E9EB6; --board-a: #74A9FF; --board-b: #FF8571;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* Scoreboard */
.board { background: var(--board); color: var(--board-ink); border-bottom: 4px solid var(--gold); }
.board .wrap { padding-block: 18px 20px; display: grid; grid-template-columns: auto 1fr auto; gap: 20px 28px; align-items: center; }
.brand { display: flex; flex-direction: column; gap: 2px; }
.mark { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: .01em; text-transform: uppercase; }
.mark b { color: var(--gold); }
.brand small { color: var(--board-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; }
.score { display: flex; align-items: center; justify-content: center; gap: 18px; }
.mgr { display: flex; align-items: center; gap: 14px; min-width: 0; }
.mgr.b { flex-direction: row-reverse; }
.mname { font-family: var(--display); font-weight: 600; font-size: 22px; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
.mgr.a .mname { color: var(--board-a); } .mgr.b .mname { color: var(--board-b); }
.mw { font-family: var(--display); font-weight: 800; font-size: 56px; line-height: .9; background: var(--board-2); border-radius: 6px; padding: 4px 14px 2px; min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
.dash { color: var(--board-muted); font-family: var(--display); font-size: 28px; }
.board-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.status { font-family: var(--display); font-weight: 600; font-size: 17px; text-transform: uppercase; letter-spacing: .05em; color: var(--gold); white-space: nowrap; }
.pips { grid-column: 1 / -1; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.pip { background: var(--board-2); border-radius: 4px; padding: 7px 8px 6px; display: flex; flex-direction: column; gap: 1px; border-top: 3px solid transparent; min-width: 0; }
.pip .g { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--board-muted); }
.pip .r { font-family: var(--mono); font-size: 12px; color: var(--board-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pip.wa { border-top-color: var(--board-a); } .pip.wb { border-top-color: var(--board-b); }
.pip.live { border-top-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.pip.live .g { color: var(--gold); }
.pip.off { opacity: .35; }
.ghost { background: transparent; border: 1px solid var(--board-muted); color: var(--board-ink); border-radius: 4px; padding: 5px 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.ghost:hover { border-color: var(--gold); color: var(--gold); }

/* Shared */
main { padding-block: 22px 48px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
h2 { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1.05; text-transform: uppercase; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h3 { font-family: var(--display); font-weight: 600; font-size: 19px; text-transform: uppercase; margin: 0; letter-spacing: .03em; }
.btn { border: 0; border-radius: 6px; padding: 10px 16px; font-weight: 600; background: var(--sunk); color: var(--ink); border: 1px solid var(--line); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--gold); color: #13213A; border-color: var(--gold); }
.btn.primary:hover { filter: brightness(1.05); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.pos { display: inline-grid; place-items: center; min-width: 30px; height: 22px; padding: 0 6px; border-radius: 4px; font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .04em; background: var(--sunk); border: 1px solid var(--line); }

/* Setup */
#setup .card { padding: 20px; display: grid; gap: 16px; margin-top: 22px; }
.setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field legend { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; padding: 0; }
.field input[type=text], .field select { padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--sunk); }
fieldset.field { border: 0; margin: 0; padding: 0; }
.radio { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Build view */
.work { display: grid; grid-template-columns: minmax(0, 1fr) 370px; gap: 20px; align-items: start; }
.poolwrap { display: grid; gap: 14px; min-width: 0; }
.slate { padding: 16px; display: grid; gap: 10px; }
.slate-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.game { background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; display: flex; justify-content: space-between; gap: 8px; font-family: var(--display); font-size: 16px; font-weight: 600; letter-spacing: .03em; }
.game span:last-child { font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 400; align-self: center; }
.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.tabs button { border: 0; background: transparent; padding: 7px 14px; font-weight: 600; font-size: 13px; }
.tabs button[aria-pressed=true] { background: var(--ink); color: var(--bg); }
.tools input, .tools select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.tools input { flex: 1 1 160px; min-width: 0; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
.pool th, .box th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; padding: 10px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.pool td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.pool tr:last-child td { border-bottom: 0; }
.pool tr.in td { background: var(--a-soft); }
.pool.side-b tr.in td { background: var(--b-soft); }
.pool tr.cant td:not(:last-child) { opacity: .5; }
.r-num { text-align: right; }
.pname { font-weight: 600; }
.psub { font-size: 12px; color: var(--muted); font-family: var(--mono); }
.trend { font-size: 11px; font-family: var(--mono); margin-left: 4px; }
.up { color: var(--good); } .down { color: var(--bad); }
.skill { display: flex; align-items: center; gap: 8px; }
.skill i { display: block; height: 5px; width: 54px; background: var(--sunk); border-radius: 3px; overflow: hidden; border: 1px solid var(--line); }
.skill i::after { content: ""; display: block; height: 100%; width: var(--w); background: var(--gold); }
.addbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 5px 10px; font-weight: 600; font-size: 12px; white-space: nowrap; }
.addbtn:hover { border-color: var(--ink); }
.addbtn.rm { color: var(--bad); }
.empty { padding: 24px; text-align: center; color: var(--muted); }

.lineup { position: sticky; top: 14px; display: grid; gap: 0; overflow: hidden; }
.lu-head { padding: 16px 18px 14px; display: grid; gap: 4px; border-top: 5px solid var(--a); }
.side-b .lu-head, .lineup.side-b .lu-head { border-top-color: var(--b); }
.cap { padding: 0 18px 14px; display: grid; gap: 6px; }
.cap-bar { height: 8px; background: var(--sunk); border-radius: 4px; border: 1px solid var(--line); overflow: hidden; }
.cap-bar i { display: block; height: 100%; background: var(--a); width: var(--w); transition: width .25s ease; }
.lineup.side-b .cap-bar i { background: var(--b); }
.cap-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); gap: 8px; }
.cap-row strong { color: var(--ink); font-family: var(--mono); font-weight: 600; }
.slots { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.slot { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto 28px; gap: 10px; align-items: center; padding: 10px 18px; border-bottom: 1px solid var(--line); min-height: 56px; }
.slot .pos { min-width: 40px; }
.slot.open .who { color: var(--muted); font-style: italic; }
.slot .who { min-width: 0; }
.slot .who .pname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.x { border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px; border-radius: 4px; }
.x:hover { color: var(--bad); background: var(--sunk); }
.lu-foot { padding: 14px 18px 18px; display: grid; gap: 10px; }
.lu-foot .row .btn { flex: 1; }
.hint { font-size: 12px; color: var(--muted); }
.projline { display: flex; justify-content: space-between; font-size: 13px; }

/* Handoff */
.handoff { max-width: 560px; margin: 30px auto; padding: 28px; display: grid; gap: 14px; text-align: center; justify-items: center; }
.handoff .big { font-family: var(--display); font-size: 64px; font-weight: 800; line-height: 1; color: var(--b); }

/* Results */
.result-hero { padding: 22px; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr) auto; align-items: center; overflow: hidden; }
.result-hero.wa { border-left: 6px solid var(--a); } .result-hero.wb { border-left: 6px solid var(--b); }
.finals { display: flex; gap: 22px; align-items: baseline; flex-wrap: wrap; }
.final { display: flex; flex-direction: column; }
.final .t { font-family: var(--display); font-size: 48px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.final.a .t { color: var(--a); } .final.b .t { color: var(--b); }
.final.lose .t { opacity: .5; }
.final small { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.boxes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 20px; }
.box-card { overflow: hidden; min-width: 0; }
.box-card header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-top: 5px solid var(--a); }
.box-card.b header { border-top-color: var(--b); }
.box td { padding: 8px 10px; border-top: 1px solid var(--line); white-space: nowrap; }
.box td.r-num, .box th.r-num { text-align: right; }
.box .fp { font-weight: 600; }
.box tfoot td { font-weight: 700; background: var(--sunk); }
.box tbody tr { animation: rise .45s ease both; animation-delay: calc(var(--i) * 70ms); }
@keyframes rise { from { transform: translateY(6px); opacity: .25; } to { transform: none; opacity: 1; } }
.tag { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; padding: 1px 5px; border-radius: 3px; margin-left: 6px; font-weight: 700; vertical-align: 1px; }
.tag.hot { background: var(--gold); color: #13213A; }
.tag.cold { background: var(--sunk); color: var(--muted); border: 1px solid var(--line); }
.tag.both { background: transparent; color: var(--muted); border: 1px dashed var(--muted); }
.legend { font-size: 12px; color: var(--muted); margin-top: 14px; }
.champ { text-align: center; padding: 34px 22px; display: grid; gap: 10px; justify-items: center; background: var(--board); color: var(--board-ink); border: 0; border-bottom: 4px solid var(--gold); }
.champ .eyebrow { color: var(--gold); }
.champ h2 { font-size: 46px; }
.champ p { margin: 0; color: var(--board-muted); }

#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 6px; font-weight: 500; opacity: 0; pointer-events: none; transition: .2s ease; max-width: calc(100% - 32px); z-index: 20; }
#toast.show { opacity: 1; transform: translateX(-50%); }

@media (max-width: 960px) {
  .work { grid-template-columns: minmax(0, 1fr); }
  .lineup { position: static; order: -1; }
  .boxes { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .board .wrap { grid-template-columns: 1fr auto; }
  .score { grid-column: 1 / -1; grid-row: 2; justify-content: space-between; }
  .mw { font-size: 44px; min-width: 52px; }
  .mname { font-size: 18px; }
  .board-side { grid-column: 2; grid-row: 1; }
  .status { white-space: normal; text-align: right; font-size: 14px; }
  .pip .r { display: none; }
  .pip { padding: 6px 4px; text-align: center; }
  .hide-sm { display: none; }
  .result-hero { grid-template-columns: minmax(0, 1fr); }
  .final .t { font-size: 38px; }
  .champ h2 { font-size: 34px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<header class="board"><div class="wrap" id="board"></div></header>
<div class="wrap">
  <section id="setup" hidden>
    <form class="card" id="setup-form">
      <div><div class="eyebrow">New series</div><h2>Set up the week</h2></div>
      <div class="setup-grid">
        <div class="field"><label for="setup-a">Manager 1</label><input type="text" id="setup-a" maxlength="18" value="You"></div>
        <div class="field"><label for="setup-b">Manager 2</label><input type="text" id="setup-b" maxlength="18" value="The Rival"></div>
        <div class="field"><label for="setup-cap">Daily salary cap</label>
          <select id="setup-cap">
            <option value="40000">40,000 credits (tight)</option>
            <option value="50000" selected>50,000 credits (standard)</option>
            <option value="60000">60,000 credits (loose)</option>
          </select></div>
        <fieldset class="field"><legend>Manager 2 is</legend>
          <label class="radio"><input type="radio" name="setup-mode" id="setup-mode-cpu" value="cpu" checked> The computer</label>
          <label class="radio"><input type="radio" name="setup-mode" id="setup-mode-local" value="local"> A friend on this device</label>
        </fieldset>
      </div>
      <div class="row">
        <button type="submit" class="btn primary">Start series</button>
        <button type="button" class="btn" data-action="setup-cancel">Keep current series</button>
        <span class="hint">Starting a new series ends the current one and drafts a fresh league.</span>
      </div>
    </form>
  </section>
  <main id="main"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const SLOTS = ['G', 'G', 'F', 'F', 'C', 'UTIL'];
const SLOT_HINT = { G: 'Pick a guard', F: 'Pick a forward', C: 'Pick a center', UTIL: 'Any position' };
const TIPS = ['7:00 PM', '7:30 PM', '8:00 PM', '9:30 PM'];
const TEAMS = [
  ['HBR', 'Harbor City Tides'], ['ASH', 'Ashford Foxes'], ['MRL', 'Marlow Comets'], ['PIN', 'Pine Ridge Lumberjacks'],
  ['CRB', 'Crescent Bay Gulls'], ['IRV', 'Iron Valley Forge'], ['SUM', 'Summit Peaks'], ['RDG', 'Redgate Rams'],
  ['LKS', 'Lakeshore Herons'], ['DST', 'Dust Flats Coyotes'], ['NOV', 'Nova Heights Sparks'], ['GRN', 'Greenmoor Owls'],
];
const FIRST = ['Darius', 'Mateo', 'Jalen', 'Ikenna', 'Theo', 'Rashad', 'Luka', 'Omar', 'Caleb', 'Tariq', 'Andre', 'Kofi', 'Elias', 'Marcus', 'Dev', 'Nico', 'Quentin', 'Sami', 'Isaiah', 'Bruno', 'Felix', 'Hakeem', 'Jonah', 'Kenji', 'Malik', 'Rafael', 'Tobias', 'Zion', 'Aaron', 'Desmond', 'Emeka', 'Gabe', 'Idris', 'Jordan', 'Levi', 'Mason', 'Noah', 'Reggie', 'Silas', 'Victor'];
const LAST = ['Okafor', 'Reyes', 'Lindqvist', 'Haddad', 'Mercer', 'Tran', 'Abara', 'Castillo', 'Whitfield', 'Novak', 'Asante', 'Brennan', 'Delacroix', 'Fontaine', 'Greer', 'Holloway', 'Ibeh', 'Jansen', 'Kowalski', 'Lambert', 'Moreau', 'Nwosu', 'Ortega', 'Pryor', 'Quinlan', 'Rasheed', 'Sato', 'Thorne', 'Underwood', 'Vance', 'Wallace', 'Yilmaz', 'Zeller', 'Adeyemi', 'Bishop', 'Calloway', 'Dumont', 'Ekwueme', 'Ferreira', 'Graves'];
// Typical stat lines by position; a night's box score is this template scaled to the player's output.
const TEMPL = {
  G: { pts: 20, reb: 4, ast: 7, stl: 1.5, blk: .3, to: 2.5 },
  F: { pts: 18, reb: 7, ast: 3, stl: 1, blk: .8, to: 2 },
  C: { pts: 15, reb: 11, ast: 2, stl: .7, blk: 1.8, to: 2 },
};
const fpOf = s => s.pts + 1.2 * s.reb + 1.5 * s.ast + 3 * s.stl + 3 * s.blk - s.to;
const proj = r => 10 + (r - 55) * 0.85;
const salary = r => Math.round((3000 + (r - 55) * 205) / 100) * 100;
const STORE = 'best-of-7-v1';

const rnd = Math.random;
const randn = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = n => n.toLocaleString('en-US');
const f1 = n => n.toFixed(1);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = s => document.querySelector(s);

let state, byId;
const ui = { pos: 'ALL', q: '', sort: 'sal', fresh: false };

function makeLeague() {
  const used = new Set(), players = [];
  let id = 1;
  for (const [abbr] of TEAMS) {
    const ratings = shuffle([[84, 95], [76, 86], [70, 80], [66, 76], [62, 72], [58, 68], [55, 65], [55, 63]].map(([a, b]) => ri(a, b)));
    ['G', 'G', 'G', 'F', 'F', 'F', 'C', 'C'].forEach((pos, i) => {
      let name;
      do name = FIRST[ri(0, FIRST.length - 1)] + ' ' + LAST[ri(0, LAST.length - 1)]; while (used.has(name));
      used.add(name);
      players.push({ id: id++, name, team: abbr, pos, r: ratings[i], trend: 0, log: [] });
    });
  }
  return players;
}

function makeSlate() {
  const t = shuffle(TEAMS.map(x => x[0])).slice(0, 8);
  return [0, 1, 2, 3].map(i => ({ away: t[i * 2], home: t[i * 2 + 1], tip: TIPS[i] }));
}

const blank = () => SLOTS.map(() => null);

function newState(o) {
  return { v: 1, cap: o.cap, mode: o.mode, names: o.names, players: makeLeague(), day: 0, wins: [0, 0], history: [], phase: 'build', builder: 0, lineups: [blank(), blank()], slate: makeSlate(), last: null };
}

function index() { byId = new Map(state.players.map(p => [p.id, p])); }
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }
function load() { try { const s = JSON.parse(localStorage.getItem(STORE)); return s && s.v === 1 ? s : null; } catch (e) { return null; } }

const playing = () => new Set(state.slate.flatMap(g => [g.away, g.home]));
const pool = () => { const t = playing(); return state.players.filter(p => t.has(p.team)); };
function matchup(team) {
  const g = state.slate.find(g => g.away === team || g.home === team);
  return g.away === team ? '@ ' + g.home : 'vs ' + g.away;
}
const spent = lu => lu.reduce((s, id) => s + (id ? salary(byId.get(id).r) : 0), 0);
const projSum = lu => lu.reduce((s, id) => s + (id ? proj(byId.get(id).r) : 0), 0);
const l3 = p => p.log.length ? p.log.reduce((a, b) => a + b, 0) / p.log.length : null;
const elig = (slot, p) => slot === 'UTIL' || p.pos === slot;

/* Lineup builder used by the computer manager and by Auto-fill: random valid lineups, then greedy upgrades. */
function buildLineup(base, pl, cap, noise) {
  const val = new Map(pl.map(p => [p.id, proj(p.r) * (1 + noise * randn())]));
  const sal = id => salary(byId.get(id).r);
  const minSal = Math.min(...pl.map(p => salary(p.r)));
  const free = SLOTS.map((_, i) => i).filter(i => base[i] == null);
  let best = null, bestV = -Infinity;
  for (let t = 0; t < 120; t++) {
    const lu = base.slice();
    let s = spent(lu), ok = true;
    const order = shuffle(free.slice()).sort((a, b) => (a === 5) - (b === 5));
    for (let k = 0; k < order.length; k++) {
      const i = order[k], budget = state.cap - s - (order.length - k - 1) * minSal;
      const c = pl.filter(p => elig(SLOTS[i], p) && !lu.includes(p.id) && salary(p.r) <= budget);
      if (!c.length) { ok = false; break; }
      const p = c[Math.floor(rnd() * c.length)];
      lu[i] = p.id; s += salary(p.r);
    }
    if (!ok) continue;
    for (let pass = 0; pass < 3; pass++) {
      let improved = false;
      for (const i of free) {
        const cur = lu[i];
        let pick = cur, pv = val.get(cur);
        for (const p of pl) {
          if (!elig(SLOTS[i], p) || lu.includes(p.id) || s - sal(cur) + salary(p.r) > cap) continue;
          const v = val.get(p.id);
          if (v > pv) { pv = v; pick = p.id; }
        }
        if (pick !== cur) { s += sal(pick) - sal(cur); lu[i] = pick; improved = true; }
      }
      if (!improved) break;
    }
    const v = lu.reduce((a, id) => a + (val.get(id) ?? 0), 0);
    if (v > bestV) { bestV = v; best = lu; }
  }
  return best;
}

function perf(p) {
  const e = proj(p.r);
  let f = 1 + randn() * 0.28, note = '';
  const x = rnd();
  if (x < 0.06) { f = 0.15 + rnd() * 0.3; note = 'cold'; }
  else if (x < 0.12) { f = Math.max(f, 1) * 1.4; note = 'hot'; }
  f = Math.max(0.1, f);
  const t = TEMPL[p.pos], scale = e * f / fpOf(t), st = {};
  for (const k in t) st[k] = Math.max(0, Math.round(t[k] * scale * (0.7 + rnd() * 0.6)));
  st.fp = Math.round(fpOf(st) * 10) / 10;
  st.note = note;
  return st;
}

function simulate() {
  const night = new Map(pool().map(p => [p.id, perf(p)]));
  const sides = state.lineups.map(lu => lu.map((id, i) => {
    const p = byId.get(id);
    return { slot: SLOTS[i], id, name: p.name, team: p.team, pos: p.pos, sal: salary(p.r), ...night.get(id) };
  }));
  const totals = sides.map(s => Math.round(s.reduce((a, x) => a + x.fp, 0) * 10) / 10);
  let w = totals[0] > totals[1] ? 0 : totals[1] > totals[0] ? 1 : null;
  if (w === null) { const top = sides.map(s => Math.max(...s.map(x => x.fp))); w = top[0] >= top[1] ? 0 : 1; }
  // Skill moves with form: strong nights raise a player's rating (and salary), poor nights lower it.
  night.forEach((pf, id) => {
    const p = byId.get(id);
    const d = Math.max(-2, Math.min(2, Math.round((pf.fp - proj(p.r)) / 7)));
    p.r = Math.max(50, Math.min(99, p.r + d));
    p.trend = d;
    p.log = [pf.fp, ...p.log].slice(0, 3);
  });
  state.wins[w]++;
  state.history.push({ winner: w, totals });
  state.last = { day: state.day, winner: w, totals, tie: totals[0] === totals[1], sides };
  state.phase = state.wins[w] >= 4 ? 'over' : 'results';
  ui.fresh = true;
}

/* ---------- Rendering ---------- */
function seriesLine() {
  const [x, y] = state.wins, n = state.names;
  if (state.phase === 'over') { const w = x > y ? 0 : 1; return `${esc(n[w])} wins ${Math.max(x, y)}–${Math.min(x, y)}`; }
  if (x === 3 && y === 3) return 'Game 7 · winner takes the week';
  if (x === y) return x === 0 ? 'Series opens tonight' : `Series tied ${x}–${y}`;
  const l = x > y ? 0 : 1;
  return `${esc(n[l])} leads ${Math.max(x, y)}–${Math.min(x, y)}`;
}

function renderBoard() {
  const done = state.phase === 'over';
  const pips = DAYS.map((d, i) => {
    const h = state.history[i];
    let cls = '', r = '—';
    if (h) { cls = h.winner === 0 ? 'wa' : 'wb'; r = `${f1(h.totals[0])}–${f1(h.totals[1])}`; }
    else if (!done && i === state.day && state.phase !== 'results') { cls = 'live'; r = 'Tonight'; }
    else if (done) cls = 'off';
    return `<li class="pip ${cls}" title="${h ? esc(state.names[h.winner]) + ' won' : ''}"><span class="g">G${i + 1} · ${d}</span><span class="r num">${r}</span></li>`;
  }).join('');
  $('#board').innerHTML = `
    <div class="brand"><span class="mark">Best <b>of</b> 7</span><small>Weekly series · first to 4 wins</small></div>
    <div class="score" aria-label="Series score">
      <div class="mgr a"><span class="mname">${esc(state.names[0])}</span><span class="mw">${state.wins[0]}</span></div>
      <span class="dash">–</span>
      <div class="mgr b"><span class="mname">${esc(state.names[1])}</span><span class="mw">${state.wins[1]}</span></div>
    </div>
    <div class="board-side"><span class="status">${seriesLine()}</span><button class="ghost" data-action="setup">New series</button></div>
    <ol class="pips">${pips}</ol>`;
}

function render() {
  renderBoard();
  const m = $('#main');
  if (state.phase === 'build') m.innerHTML = buildView();
  else if (state.phase === 'handoff') m.innerHTML = handoffView();
  else m.innerHTML = resultsView();
  if (state.phase === 'build') { renderPool(); renderLineup(); }
  if (ui.fresh) { countUp(); ui.fresh = false; }
}

function buildView() {
  const side = state.builder;
  const games = state.slate.map(g => `<div class="game"><span>${g.away} @ ${g.home}</span><span>${g.tip}</span></div>`).join('');
  return `<div class="work">
    <section class="poolwrap">
      <div class="card slate">
        <div class="slate-head"><div><div class="eyebrow">Game ${state.day + 1} · ${DAYS[state.day]} · tonight's slate</div><h2>Who's playing tonight</h2></div>
        <span class="hint">Only players in these four games can be drafted today. Both managers draft from the same pool.</span></div>
        <div class="games">${games}</div>
      </div>
      <div class="tools">
        <div class="tabs" role="group" aria-label="Filter by position">${['ALL', 'G', 'F', 'C'].map(p => `<button data-action="pos" data-v="${p}" aria-pressed="${ui.pos === p}">${p === 'ALL' ? 'All' : p}</button>`).join('')}</div>
        <input id="q" type="search" placeholder="Search players or teams" value="${esc(ui.q)}" aria-label="Search players">
        <select id="sort" aria-label="Sort players">
          ${[['sal', 'Salary'], ['proj', 'Projection'], ['value', 'Value (pts per 1K)'], ['l3', 'Recent form']].map(([v, l]) => `<option value="${v}" ${ui.sort === v ? 'selected' : ''}>Sort: ${l}</option>`).join('')}
        </select>
      </div>
      <div class="card tablewrap"><table class="pool ${side ? 'side-b' : ''}">
        <thead><tr><th>Player</th><th>Pos</th><th class="hide-sm">Skill</th><th class="r-num">Salary</th><th class="r-num">Proj</th><th class="r-num hide-sm">Last 3</th><th></th></tr></thead>
        <tbody id="poolrows"></tbody></table></div>
    </section>
    <aside class="card lineup ${side ? 'side-b' : ''}" id="lineup"></aside>
  </div>`;
}

function renderPool() {
  const lu = state.lineups[state.builder];
  const left = state.cap - spent(lu);
  const q = ui.q.trim().toLowerCase();
  let rows = pool().filter(p => (ui.pos === 'ALL' || p.pos === ui.pos) && (!q || p.name.toLowerCase().includes(q) || p.team.toLowerCase().includes(q)));
  const key = { sal: p => salary(p.r), proj: p => proj(p.r), value: p => proj(p.r) / salary(p.r), l3: p => l3(p) ?? proj(p.r) }[ui.sort];
  rows.sort((a, b) => key(b) - key(a));
  $('#poolrows').innerHTML = rows.length ? rows.map(p => {
    const inLu = lu.includes(p.id), sal = salary(p.r), cant = !inLu && sal > left;
    const tr = p.trend > 0 ? `<span class="trend up" title="Skill up ${p.trend}">▲${p.trend}</span>` : p.trend < 0 ? `<span class="trend down" title="Skill down ${-p.trend}">▼${-p.trend}</span>` : '';
    const last = l3(p);
    return `<tr class="${inLu ? 'in' : ''} ${cant ? 'cant' : ''}">
      <td><div class="pname">${esc(p.name)}${tr}</div><div class="psub">${p.team} ${matchup(p.team)}</div></td>
      <td><span class="pos">${p.pos}</span></td>
      <td class="hide-sm"><div class="skill"><span class="num">${p.r}</span><i style="--w:${Math.round((p.r - 50) / 49 * 100)}%"></i></div></td>
      <td class="r-num num">${fmt(sal)}</td>
      <td class="r-num num">${f1(proj(p.r))}</td>
      <td class="r-num num hide-sm">${last == null ? '—' : f1(last)}</td>
      <td class="r-num">${inLu ? `<button class="addbtn rm" data-action="drop" data-id="${p.id}">Remove</button>` : `<button class="addbtn" data-action="add" data-id="${p.id}" ${cant ? `title="Costs ${fmt(sal - left)} more than you have left"` : ''}>+ Add</button>`}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="7" class="empty">No players match. Clear the search or pick another position.</td></tr>`;
}

function renderLineup() {
  const side = state.builder, lu = state.lineups[side];
  const s = spent(lu), left = state.cap - s, open = lu.filter(x => x == null).length;
  const full = open === 0;
  const slots = SLOTS.map((slot, i) => {
    const p = lu[i] && byId.get(lu[i]);
    return p ? `<li class="slot"><span class="pos">${slot}</span><span class="who"><span class="pname">${esc(p.name)}</span><span class="psub">${p.pos} · ${p.team} ${matchup(p.team)}</span></span><span class="num">${fmt(salary(p.r))}</span><button class="x" data-action="remove" data-i="${i}" aria-label="Remove ${esc(p.name)}">×</button></li>`
      : `<li class="slot open"><span class="pos">${slot}</span><span class="who">${SLOT_HINT[slot]}</span><span></span><span></span></li>`;
  }).join('');
  const who = state.mode === 'cpu' ? 'Your lineup' : `${esc(state.names[side])}'s lineup`;
  $('#lineup').innerHTML = `
    <div class="lu-head"><div class="eyebrow">Game ${state.day + 1} · ${DAYS[state.day]}</div><h3>${who}</h3></div>
    <div class="cap">
      <div class="cap-row"><span>Spent <strong>${fmt(s)}</strong> of ${fmt(state.cap)}</span><span>Left <strong>${fmt(left)}</strong></span></div>
      <div class="cap-bar"><i style="--w:${Math.min(100, s / state.cap * 100)}%"></i></div>
      <div class="cap-row"><span>${open ? `${open} open · ${fmt(Math.floor(left / open))} per slot` : 'All six slots filled'}</span><span>Proj <strong>${f1(projSum(lu))}</strong> pts</span></div>
    </div>
    <ul class="slots">${slots}</ul>
    <div class="lu-foot">
      <div class="row"><button class="btn" data-action="auto" ${full ? 'disabled' : ''}>Auto-fill open slots</button><button class="btn" data-action="clear" ${lu.every(x => x == null) ? 'disabled' : ''}>Clear</button></div>
      <button class="btn primary" data-action="lock" ${full ? '' : 'disabled'}>Lock lineup${state.mode === 'cpu' ? ' and play' : ''}</button>
      <span class="hint">${full ? 'Lineups lock at tip-off. Highest fantasy total wins tonight’s game.' : `Fill all six slots under the cap to lock.`}</span>
    </div>`;
}

function handoffView() {
  return `<div class="card handoff">
    <div class="eyebrow">Game ${state.day + 1} · ${DAYS[state.day]}</div>
    <h2>${esc(state.names[0])} has locked in</h2>
    <p>Pass the device to ${esc(state.names[1])}. Their lineup is built in secret, then both teams tip off.</p>
    <span class="big" aria-hidden="true">${esc(state.names[1]).slice(0, 1).toUpperCase()}</span>
    <button class="btn primary" data-action="handoff-go">I'm ${esc(state.names[1])}, build my lineup</button>
  </div>`;
}

function boxCard(side, k, both) {
  const rows = side.map((x, i) => `<tr style="--i:${i}">
    <td><span class="pos">${x.slot}</span></td>
    <td><span class="pname">${esc(x.name)}</span>${x.note === 'hot' ? '<span class="tag hot">Big night</span>' : x.note === 'cold' ? '<span class="tag cold">Limited min</span>' : ''}${both.has(x.id) ? '<span class="tag both">Both</span>' : ''}<div class="psub">${x.pos} · ${x.team} · ${fmt(x.sal)}</div></td>
    <td class="r-num num">${x.pts}</td><td class="r-num num">${x.reb}</td><td class="r-num num">${x.ast}</td>
    <td class="r-num num hide-sm">${x.stl}</td><td class="r-num num hide-sm">${x.blk}</td><td class="r-num num hide-sm">${x.to}</td>
    <td class="r-num num fp">${f1(x.fp)}</td></tr>`).join('');
  const tot = side.reduce((a, x) => a + x.fp, 0);
  return `<section class="card box-card ${k ? 'b' : ''}">
    <header><h3>${esc(state.names[k])}</h3><span class="hint num">${fmt(side.reduce((a, x) => a + x.sal, 0))} spent</span></header>
    <div class="tablewrap"><table class="box">
      <thead><tr><th></th><th>Player</th><th class="r-num">PTS</th><th class="r-num">REB</th><th class="r-num">AST</th><th class="r-num hide-sm">STL</th><th class="r-num hide-sm">BLK</th><th class="r-num hide-sm">TO</th><th class="r-num">FP</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td></td><td>Total</td><td colspan="3"></td><td colspan="3" class="hide-sm"></td><td class="r-num num">${f1(tot)}</td></tr></tfoot>
    </table></div></section>`;
}

function resultsView() {
  const r = state.last, w = r.winner, n = state.names;
  const ids = r.sides.map(s => new Set(s.map(x => x.id)));
  const both = new Set([...ids[0]].filter(id => ids[1].has(id)));
  const over = state.phase === 'over';
  const margin = Math.abs(r.totals[0] - r.totals[1]);
  const champ = over ? `<div class="card champ"><div class="eyebrow">Week champion</div><h2>${esc(n[w])} takes the series</h2>
      <p>${state.wins[w]}–${state.wins[1 - w]} in ${state.history.length} games. ${state.history.length === 7 ? 'Settled in Game 7.' : state.history.length === 4 ? 'A clean sweep.' : ''}</p>
      <div class="row" style="justify-content:center;margin-top:8px"><button class="btn primary" data-action="rematch">Play next week (new league)</button><button class="ghost" data-action="setup">Change managers or cap</button></div></div>` : '';
  return `${champ}
    <div class="card result-hero ${w ? 'wb' : 'wa'}" style="${over ? 'margin-top:20px' : ''}">
      <div style="display:grid;gap:12px;min-width:0">
        <div class="eyebrow">Final · Game ${r.day + 1} · ${DAYS[r.day]}</div>
        <h2>${esc(n[w])} wins Game ${r.day + 1}${r.tie ? ' on the tiebreaker' : margin < 5 ? ' by a hair' : margin > 40 ? ' going away' : ''}</h2>
        <div class="finals">
          <div class="final a ${w ? 'lose' : ''}"><span class="t" data-count="${r.totals[0]}">${f1(r.totals[0])}</span><small>${esc(n[0])}</small></div>
          <div class="final b ${w ? '' : 'lose'}"><span class="t" data-count="${r.totals[1]}">${f1(r.totals[1])}</span><small>${esc(n[1])}</small></div>
        </div>
      </div>
      ${over ? '' : `<button class="btn primary" data-action="next">Draft Game ${state.day + 2} · ${DAYS[state.day + 1]}</button>`}
    </div>
    <div class="boxes">${boxCard(r.sides[0], 0, both)}${boxCard(r.sides[1], 1, both)}</div>
    <p class="legend">Scoring: points 1 · rebound 1.2 · assist 1.5 · steal 3 · block 3 · turnover −1. A tie goes to the side with the best single performance. Ratings and salaries shift after every game based on how each player performed.</p>`;
}

function countUp() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const els = [...document.querySelectorAll('[data-count]')];
  const t0 = performance.now(), dur = 1100;
  const step = t => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    els.forEach(el => { el.textContent = f1(+el.dataset.count * e); });
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- Actions ---------- */
function addPlayer(id) {
  const lu = state.lineups[state.builder], p = byId.get(id);
  if (lu.includes(id)) return;
  let i = SLOTS.findIndex((s, k) => s === p.pos && lu[k] == null);
  if (i < 0 && lu[5] == null) i = 5;
  if (i < 0) return toast(`Your ${p.pos} slots and UTIL are full. Remove someone first.`);
  const over = spent(lu) + salary(p.r) - state.cap;
  if (over > 0) return toast(`${p.name} puts you ${fmt(over)} credits over the cap.`);
  lu[i] = id;
  save(); renderPool(); renderLineup();
}

function startSeries(opts) {
  state = newState(opts); index();
  ui.pos = 'ALL'; ui.q = '';
  save(); render();
  window.scrollTo({ top: 0 });
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b || b.disabled) return;
  const a = b.dataset.action, lu = state.lineups[state.builder];
  if (a === 'add') addPlayer(+b.dataset.id);
  else if (a === 'drop') { lu[lu.indexOf(+b.dataset.id)] = null; save(); renderPool(); renderLineup(); }
  else if (a === 'remove') { lu[+b.dataset.i] = null; save(); renderPool(); renderLineup(); }
  else if (a === 'clear') { state.lineups[state.builder] = blank(); save(); renderPool(); renderLineup(); }
  else if (a === 'auto') {
    const r = buildLineup(lu, pool(), state.cap, 0.05);
    if (!r) return toast('No way to fill the open slots under the cap. Swap out a pricey player.');
    state.lineups[state.builder] = r; save(); renderPool(); renderLineup();
  }
  else if (a === 'pos') { ui.pos = b.dataset.v; document.querySelectorAll('[data-action=pos]').forEach(x => x.setAttribute('aria-pressed', x === b)); renderPool(); }
  else if (a === 'lock') {
    if (state.mode === 'cpu') { state.lineups[1] = buildLineup(blank(), pool(), state.cap, 0.18); simulate(); }
    else if (state.builder === 0) state.phase = 'handoff';
    else simulate();
    save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  else if (a === 'handoff-go') { state.builder = 1; state.phase = 'build'; ui.q = ''; ui.pos = 'ALL'; save(); render(); }
  else if (a === 'next') {
    state.day++; state.slate = makeSlate(); state.lineups = [blank(), blank()]; state.builder = 0; state.phase = 'build';
    ui.q = ''; ui.pos = 'ALL'; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  else if (a === 'rematch') startSeries({ cap: state.cap, mode: state.mode, names: state.names });
  else if (a === 'setup') {
    $('#setup-a').value = state.names[0]; $('#setup-b').value = state.names[1];
    $('#setup-cap').value = String(state.cap);
    $(state.mode === 'cpu' ? '#setup-mode-cpu' : '#setup-mode-local').checked = true;
    $('#setup').hidden = false; $('#setup-a').focus();
  }
  else if (a === 'setup-cancel') $('#setup').hidden = true;
});

$('#setup-form').addEventListener('submit', e => {
  e.preventDefault();
  const names = [$('#setup-a').value.trim() || 'Manager 1', $('#setup-b').value.trim() || 'Manager 2'];
  $('#setup').hidden = true;
  startSeries({ names, cap: +$('#setup-cap').value, mode: $('#setup-mode-local').checked ? 'local' : 'cpu' });
});

document.addEventListener('input', e => { if (e.target.id === 'q') { ui.q = e.target.value; renderPool(); } });
document.addEventListener('change', e => { if (e.target.id === 'sort') { ui.sort = e.target.value; renderPool(); } });

window.claude?.hot?.snapshot?.(() => ({ state, ui: { pos: ui.pos, q: ui.q, sort: ui.sort } }));
function start(data) {
  state = (data && data.state) || load() || newState({ cap: 50000, mode: 'cpu', names: ['You', 'The Rival'] });
  if (data && data.ui) Object.assign(ui, data.ui);
  index(); render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
