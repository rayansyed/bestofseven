const PACK_CARDS = { starter: 5, daily: 4, standard: 5, premium: 7 };
// Two players on the wrapper, from the top of the roster down: Premium gets the league's best, the others the next ones.
function packArt(type) {
  const off = { premium: 0, standard: 2, daily: 4, starter: 6 }[type] || 0;
  return [...roster].filter(([, p]) => p.gp && p.stars >= 4).sort((a, b) => b[1].avg - a[1].avg).slice(off, off + 2).map(([id, p]) => ({ id, name: p.name }));
}
// The pack itself. inner is the button's attributes; the price and what tapping does go under it.
function packHtml(type, name, attrs, busy = false) {
  const art = packArt(type), img = a => `<img src="https://a.espncdn.com/i/headshots/nba/players/full/${encodeURIComponent(a.id)}.png" alt="" loading="lazy" onerror="this.remove()">`;
  return `<button class="pack p-${type} ${busy ? 'busy' : ''}" ${attrs}><span class="pk">
    <span class="pk-crimp"></span>
    <span class="pk-top"><span class="pk-year">2026–27 Basketball Cards</span><span class="pk-art">${art.map(img).join('')}</span><span class="pk-badge">7</span></span>
    <span class="pk-band">
      <span class="pk-word">BEST OF <b>7</b></span><span class="pk-kind">${esc(name.replace(/ pack$/i, ''))}</span><span class="pk-count">${PACK_CARDS[type]} cards per pack</span></span>
    <span class="pk-crimp b"></span>
    <span class="pk-grain"></span><span class="pk-shine"></span></span></button>`;
}

// The card stack shown while opening: boosters first, then the players. st = { items, i }, i = cards flipped so far.
// A pulled card is new, a duplicate of a player you had, or a Weekly Star (always a new version of him).
const revealTag = (c, had) => c.rarity === 'star' ? ['New star', 'new'] : had.has(c.pid) ? ['Duplicate', 'dupe'] : ['New', 'new'];
const stackItems = (cards, boosters = []) => [...boosters.map(b => ({ b })), ...cards.map(c => ({ c }))];
const STK_BACK = '<span><b>7</b>BEST OF 7</span>';
function stkFace(it, had) {
  const html = it.b ? boosterHtml(it.b) : cardHtml(it.c, { tag: had ? revealTag(it.c, had) : null });
  return html.replace(/ data-pid="[^"]*"/, '');
}
function stkHint(st) {
  const n = st.items.length;
  return !st.i ? `Tap the stack to flip your first card · <b>${n}</b> cards` : st.i < n ? `Tap for the next card · <b>${st.i}</b> of ${n}` : 'Tap to see the whole pack';
}
function stageHtml(st, had) {
  const cards = st.items.map((it, k) => {
    const d = Math.max(0, k - st.i), cls = k < st.i - 1 ? 'gone' : k === st.i - 1 ? 'up' : d > 4 ? 'deep' : '';
    return `<div class="stk-card ${cls}" style="--d:${d}"><div class="stk-in"><div class="stk-back">${STK_BACK}</div><div class="stk-face">${stkFace(it, had)}</div></div></div>`;
  }).join('');
  return `<div class="stk-stage" id="stk"><div class="stk-wrap"><button class="stk" data-action="flip" aria-label="Flip the next card">${cards}</button></div>
    <p class="stk-hint" id="stk-hint" aria-live="polite">${stkHint(st)}</p>
    <button class="linkbtn" data-action="flip-all">Show all cards</button></div>`;
}
const curStack = () => ui.packReveal?.st && !ui.packReveal.st.done ? ui.packReveal.st : ui.reveal && ui.revealSt && !ui.revealSt.done ? ui.revealSt : null;
function finishStack() {
  const st = curStack(); if (!st) return;
  st.done = true;
  if (ui.packReveal?.st === st) ui.packReveal.played = true; else ui.revealPlayed = true;
  ui.sig = ''; render(); window.scrollTo({ top: 0 });
}
// Flips the next card in place, without redrawing the page, so the animation runs.
function flipNext() {
  const st = curStack(), el = $('#stk');
  if (!st) return;
  if (st.i >= st.items.length) { finishStack(); return; }
  st.i++;
  if (!el) { ui.sig = ''; render(); return; }
  el.querySelectorAll('.stk-card').forEach((c, k) => {
    const d = Math.max(0, k - st.i);
    c.style.setProperty('--d', d);
    c.classList.toggle('gone', k < st.i - 1); c.classList.toggle('up', k === st.i - 1); c.classList.toggle('deep', k >= st.i && d > 4); c.classList.remove('hit');
  });
  $('#stk-hint').innerHTML = stkHint(st);
  const rarity = st.items[st.i - 1].c?.rarity;
  if (rarity && rarity !== 'common') setTimeout(() => pullFx(el, rarity, el.querySelectorAll('.stk-card')[st.i - 1]), 380);
}
// A burst for a Rare, Epic or Legendary pull; Legendary also shakes the stage.
function pullFx(stage, rarity, card) {
  if (!stage.isConnected) return;
  const wrap = stage.querySelector('.stk-wrap'), n = { rare: 12, epic: 20, legendary: 28 }[rarity] || 12;
  stage.querySelectorAll('.fx-back, .fx-front').forEach(x => x.remove());
  const back = document.createElement('div'), front = document.createElement('div');
  back.className = front.className = '';
  back.className = `fx-back fx-${rarity}`; front.className = `fx-front fx-${rarity}`;
  back.innerHTML = '<i class="fx-rays"></i><i class="fx-glow"></i>';
  front.innerHTML = Array.from({ length: n }, (_, j) => `<i class="fx-p" style="--a:${Math.round(j * 360 / n + Math.random() * 12)}deg;--r:${Math.round(120 + Math.random() * (rarity === 'legendary' ? 140 : 90))}px;--t:${(.7 + Math.random() * .6).toFixed(2)}s"></i>`).join('')
    + `<b class="fx-label">${RARITY[rarity].name}!</b>`;
  wrap.prepend(back); wrap.append(front);
  if (card) { card.style.setProperty('--fx', getComputedStyle(back).getPropertyValue('--fx')); card.classList.remove('hit'); void card.offsetWidth; card.classList.add('hit'); }
  if (rarity === 'legendary') { stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake'); }
  setTimeout(() => { back.remove(); front.remove(); }, 2700);
}

// Last week's Team of the Week, the Weekly Stars in packs this week.
function towPanel() {
  const t = rosterStars && rosterStars.packWeek === weekOf(etDay()) ? rosterStars : null;
  if (!t?.players?.length) return '';
  const card = s => starCardHtml({ pid: s.pid, name: s.name, team: s.team, pos: s.pos, rarity: 'star', star: { week: t.week, stat: s.stat, label: s.label, statPg: s.statPg, fpg: s.fpg, caption: s.caption } }, { tag: [s.slot === 'UTIL' ? '6th man' : s.slot, 'pos'] });
  return `<section class="panel tow"><div class="list-head"><div><div class="eyebrow">In packs until Sunday</div><h2>Weekly stars</h2></div></div>
    <div class="tc-grid">${t.players.map(card).join('')}</div></section>`;
}

// Packs given to the player by hand (giftPacks on their user document, set in the Firebase console).
const giftCount = () => Object.values(profile?.giftPacks || {}).reduce((s, n) => s + (n > 0 ? n : 0), 0);

// Time until the next US Eastern day, when the daily pack resets.
function untilTomorrow() {
  const [h, m] = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' }).format(new Date()).split(':').map(Number);
  const left = 24 * 60 - (h * 60 + m);
  return `${Math.floor(left / 60)}h ${left % 60}m`;
}

function packsView() {
  const coins = profile.coins || 0, dailyDone = profile.dailyPack === etDay(), r = ui.packReveal;
  const tile = t => {
    const daily = t.type === 'daily', can = daily ? !dailyDone : coins >= t.price, busy = ui.opening === t.type;
    const cta = busy ? 'Opening…' : daily ? (dailyDone ? `New pack in ${untilTomorrow()}` : 'Open free') : can ? 'Open' : `Need 🪙 ${t.price - coins} more`;
    return `<div class="shop-item">${packHtml(t.type, t.name, `data-action="buy" data-t="${t.type}" ${!can || ui.opening ? 'disabled' : ''} aria-label="${t.name}, ${t.price ? t.price + ' coins' : 'free'}: ${t.what}"`, busy)}
      <span class="pk-price">${t.price ? `🪙 ${t.price}` : 'Free'}</span><span class="pk-cta">${cta}</span>
      <p class="hint">${t.what}.</p></div>`;
  };
  // Extra copies of a player beyond your best card of him.
  const groups = new Map();
  for (const c of allCards) { if (!groups.has(c.pid)) groups.set(c.pid, []); groups.get(c.pid).push(c); }
  for (const g of groups.values()) g.sort((a, b) => RARITY_RANK[b.rarity] - RARITY_RANK[a.rarity] || (b.level || 1) - (a.level || 1));
  // A copy carrying levels is never listed for sale.
  const dupes = [...groups.values()].flatMap(g => g.slice(1).filter(c => !(c.level > 1)));
  const dupeValue = dupes.reduce((s, c) => s + SELL_VALUE[c.rarity || 'common'], 0);
  const dupeRows = dupes.map(c => {
    const p = { ...c, ...roster.get(c.pid), id: c.pid };
    return `<div class="runner sub" data-pid="${esc(c.pid)}">${face(p)}
      <div><div class="r-name">${plink(p)}${rarityTag(c.rarity) || '<span class="rar r-common">Common</span>'}</div><div class="r-sub">${esc(p.team)} · ${POS_NAME[p.pos] || ''} · you keep your ${RARITY[groups.get(c.pid)[0].rarity || 'common'].name} card</div></div>
      <div class="r-act">${canLevel(c.pid) ? `<button class="btn" data-action="player" data-id="${esc(c.pid)}">▲ Level up</button>` : ''}<button class="btn" data-action="sell" data-id="${esc(c.id)}" ${ui.selling ? 'disabled' : ''}>Sell · 🪙 ${SELL_VALUE[c.rarity || 'common']}</button></div></div>`;
  }).join('');
  // The flip-in plays once: the cards, boosters and coins that arrive just after opening redraw the page.
  const fresh = !!r && !r.played;
  if (r) r.played = true;
  const giftTile = t => {
    const n = profile.giftPacks[t.type], busy = ui.opening === 'gift-' + t.type;
    return `<div class="shop-item">${packHtml(t.type, t.name, `data-action="gift" data-t="${t.type}" ${ui.opening ? 'disabled' : ''} aria-label="Open a gifted ${t.name}. You have ${n}."`, busy)}
      <span class="pk-price">Gift ×${n}</span><span class="pk-cta">${busy ? 'Opening…' : 'Tap to open'}</span>
      <p class="hint">${t.what}.</p></div>`;
  };
  const gifts = SHOP.filter(t => (profile.giftPacks?.[t.type] || 0) > 0);
  const giftPanel = gifts.length ? `<section class="panel gift-head"><div class="list-head"><div><div class="eyebrow">Gifts</div><h2>You’ve been given ${giftCount()} pack${giftCount() > 1 ? 's' : ''}</h2></div></div><div class="shop">${gifts.map(giftTile).join('')}</div></section>` : '';
  if (r && r.st && !r.st.done) return `<section class="panel pack-reveal"><div class="list-head"><div><div class="eyebrow">${r.gift ? 'Gifted ' : ''}${SHOP.find(t => t.type === r.type)?.name || 'Pack'}</div>
      <h2>Your pack is open</h2></div></div>${stageHtml(r.st, r.had)}</section>`;
  const reveal = r ? `<section class="panel pack-reveal"><div class="list-head"><div><div class="eyebrow">${r.gift ? 'Gifted ' : ''}${SHOP.find(t => t.type === r.type)?.name || 'Pack'}</div>
      <h2>${r.cards.length} players and ${r.boosters.length} booster${r.boosters.length === 1 ? '' : 's'}</h2></div><button class="btn" data-action="reveal-done">Done</button></div>
    <div class="tc-grid">${r.cards.map((c, i) => cardHtml(c, { fresh, i, tag: revealTag(c, r.had) })).join('')}${r.boosters.map((b, j) => boosterHtml(b, { fresh, i: r.cards.length + j })).join('')}</div></section>` : '';
  return `${reveal}${giftPanel}
    ${towPanel()}
    <section class="panel shop-head"><div class="list-head"><div><h2>Shop</h2></div></div>
      <div class="shop">${SHOP.map(tile).join('')}</div></section>
    <section class="panel"><div class="list-head"><div><h2>Duplicates · ${dupes.length}</h2><p class="sub">Extra copies of players you already have. Your best card of each player is kept.</p></div>
      ${dupes.length ? `<button class="btn primary" data-action="sell-dupes" ${ui.selling ? 'disabled' : ''}>Sell all · 🪙 ${dupeValue}</button>` : ''}</div>
      ${dupeRows || '<p class="empty">No duplicates right now.</p>'}</section>`;
}

// Selling from a player's profile: the lowest copy goes first, and selling your only copy takes a second tap.
function sellFoot(pid) {
  const copies = allCards.filter(c => c.pid === pid).sort((a, b) => RARITY_RANK[a.rarity] - RARITY_RANK[b.rarity]);
  if (!copies.length) return '';
  // Sell a plain spare first: never the card that plays or a copy carrying levels while there's another to sell.
  const keep = cards.get(pid)?.id, c = copies.find(x => x.id !== keep && !(x.level > 1)) || copies[0], v = SELL_VALUE[c.rarity || 'common'], last = copies.length === 1, sure = ui.sellConfirm === c.id;
  const label = !last ? `Sell a ${RARITY[c.rarity || 'common'].name} copy · 🪙 ${v}` : sure ? `Tap again to sell your only card · 🪙 ${v}` : `Sell this card · 🪙 ${v}`;
  return `<div class="pc-foot pc-sell"><span class="pc-dim">You have ${copies.length} card${copies.length > 1 ? 's' : ''} of him</span>
    <button class="btn ${sure ? 'danger' : ''}" data-action="sell-one" data-id="${esc(c.id)}" data-pid="${esc(pid)}" data-last="${last}" ${ui.selling ? 'disabled' : ''}>${label}</button></div>`;
}

// Levelling up from a player's profile: pick a category, then spend two duplicates.
function levelFoot(pid) {
  const c = cards.get(pid);
  if (!c) return '';
  const lvl = c.level || 1, spare = sparesOf(pid), has = c.picks?.length ? ` · ${picksText(c.picks)}` : '';
  if (lvl >= LEVEL.max) return `<div class="pc-lvl"><div class="pc-lvl-top"><b>Level ${lvl}${has}</b><span class="pc-dim">Top level.</span></div></div>`;
  const can = spare >= LEVEL.cost;
  const chips = LEVEL_STATS.map(([k, l]) => `<button class="lv-pick" data-action="lvl-pick" data-s="${k}" aria-pressed="${ui.lvlPick === k}">${l}</button>`).join('');
  return `<div class="pc-lvl"><div class="pc-lvl-top"><b>Level ${lvl}${has}</b>
      <span class="pc-dim">${can ? `Level up to ${lvl + 1}: uses ${LEVEL.cost} duplicates and adds +${Math.round(LEVEL.bonus * 100)}% to the category you pick.` : `Level ${lvl + 1} needs ${LEVEL.cost} duplicates of him. You have ${spare}.`}</span></div>
    ${can ? `<div class="lv-picks">${chips}</div>
      <button class="btn primary" data-action="lvl-go" data-pid="${esc(pid)}" ${ui.lvlPick && !ui.leveling ? '' : 'disabled'}>${ui.leveling ? 'Levelling up…' : ui.lvlPick ? `Level up to ${lvl + 1} · +${Math.round(LEVEL.bonus * 100)}% ${LEVEL_LABEL[ui.lvlPick]}` : 'Pick a category'}</button>` : ''}</div>`;
}
async function levelUp(pid, stat) {
  if (ui.leveling || !stat) return;
  ui.leveling = true; refreshPlayer();
  try {
    const out = await api('/api/level', { pid, stat });
    toast(`${out.name || roster.get(pid)?.name || 'Your card'} is now Level ${out.level} · ${picksText(out.picks)}`);
    ui.lvlPick = null;
  } catch (err) { toast(err.message); }
  ui.leveling = false; refreshPlayer();
}

// The pack and sell endpoints (api/*.js), signed in as the player.
async function api(path, body) {
  let r;
  try {
    const token = await auth.currentUser.getIdToken();
    r = await fetch(path, { method: 'POST', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  } catch (err) { throw new Error('That didn’t go through. Check your connection and try again.'); }
  const out = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(out.error || 'That didn’t work. Try again.');
  return out;
}

async function openPack(type, gift = false) {
  if (ui.opening) return;
  const no = (profile.starterPacks || 0) + 1, had = new Set(cards.keys());
  ui.opening = gift ? 'gift-' + type : type; ui.sig = ''; render();
  try {
    const out = await api('/api/packs', gift ? { type, gift: true } : { type });
    // Played = the grid's flip-in is skipped afterwards, since the stack already showed each card.
    if (type === 'starter') { ui.reveal = out.cards; ui.revealNo = no; ui.revealPlayed = true; ui.revealSt = { items: stackItems(out.cards), i: 0 }; }
    else { ui.packReveal = { type, gift, cards: out.cards, boosters: out.boosters || [], had, played: true, st: { items: stackItems(out.cards, out.boosters || []), i: 0 } }; }
    window.scrollTo({ top: 0 });
  } catch (err) { toast(err.message); }
  ui.opening = false; ui.sig = ''; render();
}

async function sellCards(ids) {
  if (ui.selling || !ids.length) return;
  ui.selling = true; ui.sig = ''; render();
  try {
    const out = await api('/api/sell', { ids });
    toast(`Sold ${out.sold} card${out.sold > 1 ? 's' : ''} for 🪙 ${out.coins}.`);
  } catch (err) { toast(err.message); }
  ui.selling = false; ui.sellConfirm = null; ui.sig = ''; render();
}

function packView() {
  // The reveal can land before the profile update that counts the pack.
  const opened = Math.max(profile.starterPacks || 0, ui.reveal ? ui.revealNo : 0), left = STARTER_PACKS - opened;
  const intro = `<section class="hero-card"><div><div class="eyebrow">Welcome, ${esc(profile.name)}</div><h1>${ui.reveal ? `Pack ${opened} of ${STARTER_PACKS}` : 'Open your starter packs'}</h1>
    <p class="hero-sub">${ui.reveal ? (left ? `${left} more to open.` : 'That’s your starting collection: 15 cards.') : `You get ${STARTER_PACKS} free packs of 5 cards: 2 guards, 2 forwards and a center in each. Your lineups are built from the cards you own.`}</p></div></section>`;
  if (ui.reveal && ui.revealSt && !ui.revealSt.done) return intro + `<section class="panel pack-reveal">${stageHtml(ui.revealSt)}</section>`;
  if (ui.reveal) {
    // As on the Packs page, the flip-in plays only on the reveal's first draw.
    const fresh = !ui.revealPlayed;
    ui.revealPlayed = true;
    return intro + `<section class="panel pack-reveal"><div class="tc-grid">${ui.reveal.map((c, i) => cardHtml(c, { fresh, i })).join('')}</div>
      <div class="row pack-row">${left ? `<button class="btn primary" data-action="pack" ${ui.opening ? 'disabled' : ''}>${ui.opening ? 'Opening…' : `Open pack ${opened + 1}`}</button>` : '<button class="btn primary" data-action="pack-done">Start playing</button>'}</div></section>`;
  }
  return intro + `<section class="panel pack-start">
    ${packHtml('starter', 'Starter pack', `data-action="pack" ${ui.opening ? 'disabled' : ''} aria-label="Open starter pack ${opened + 1} of ${STARTER_PACKS}"`, !!ui.opening)}
    <span class="pk-price">Pack ${opened + 1} of ${STARTER_PACKS}</span><span class="pk-cta">${ui.opening ? 'Opening…' : 'Tap the pack to open it'}</span>
    <p class="hint">Starter cards are all Common and leave out the league’s top-rated players. The first pack favours players with a game in the next two days, so you can play right away.</p></section>`;
}

function cardsView() {
  // The next slate you can still enter: tonight's if it hasn't tipped off, otherwise the next one.
  const today = days.get(nextOpenDate() || '');
  const when = today ? (today.date === etDay() ? 'Tonight' : dayLabel(today.date).split(',')[0]) : '';
  const tonight = new Set((today?.players || []).map(p => p.id));
  const list = [...cards.values()].filter(c => ui.cardPos === 'ALL' || (roster.get(c.pid)?.pos || c.pos) === ui.cardPos)
    .sort((a, b) => RARITY_RANK[b.rarity] - RARITY_RANK[a.rarity] || (roster.get(b.pid)?.stars || 0) - (roster.get(a.pid)?.stars || 0) || String(roster.get(a.pid)?.name || a.name || '').localeCompare(roster.get(b.pid)?.name || b.name || ''));
  const n = p => p === 'ALL' ? cards.size : [...cards.values()].filter(c => (roster.get(c.pid)?.pos || c.pos) === p).length;
  const tabs = [['ALL', 'All'], ['G', 'Guards'], ['F', 'Forwards'], ['C', 'Centers']].map(([v, l]) => `<button class="tab" data-action="card-pos" data-v="${v}" aria-pressed="${ui.cardPos === v}">${l} · ${n(v)}</button>`).join('');
  const arch = Object.entries(TYPES).map(([k, t]) => `<li>${typeChip(k)}<span>${esc(t.what)}</span></li>`).join('');

  return `<section class="panel"><div class="list-head"><div><h2>My cards</h2><p class="sub">${cards.size} cards. ${today ? `${[...cards.keys()].filter(id => tonight.has(id)).length} of them play ${dayLabel(today.date).split(',')[0]}.` : ''} Tap a card for the player’s profile.</p></div></div>
      <div class="pool-tools"><div class="tabs">${tabs}</div></div>
      ${list.length ? `<div class="tc-grid">${list.map(c => cardHtml(c, { tag: tonight.has(c.pid) ? [when, 'play'] : null, ready: canLevel(c.pid) })).join('')}</div>` : '<p class="empty">No cards here yet.</p>'}
    </section>
    <section class="panel"><div class="list-head"><div><h2>Boosters · ${boosters.length}</h2><p class="sub">Tap a card on the court, then pick a booster. It lifts that player for that night’s game and is used up when the night locks.</p></div></div>
      ${boosters.length ? `<div class="tc-grid">${boosters.map(b => boosterHtml(b, { tag: reserved.has(b.id) ? [`Set for ${dayLabel(reserved.get(b.id)).split(',')[0]}`, 'set'] : null })).join('')}</div>` : '<p class="empty">No boosters yet. Every pack has at least one.</p>'}</section>
    <section class="panel arch-legend"><div class="list-head"><div><h2>Archetypes, counters and combos</h2><p class="sub">Set each month from season stats. The league’s elite players can carry two.</p></div></div>
      <ul class="arch-list">${arch}</ul>
      <h3 class="arch-h">Counters (between facing slots, −10%)</h3><ul class="arch-list">${COUNTERS.map(c => `<li>${typeChip(c.by)}<span>${esc(c.text)}</span></li>`).join('')}</ul>
      <h3 class="arch-h">Combos (whole lineup)</h3><ul class="arch-list">${SYNERGIES.map(sy => `<li><span class="arch syn">${esc(sy.name)}</span><span>${esc(sy.text)}</span></li>`).join('')}</ul>
    </section>`;
}

const plink = p => `<button class="plink" data-action="player" data-id="${esc(p.id)}" aria-label="View ${esc(p.name)}’s profile">${esc(p.name)}</button>`;

function until(iso) {
  const ms = Date.parse(iso) - Date.now();
  if (ms <= 0) return 'now';
  const h = Math.floor(ms / 36e5), mm = Math.floor(ms % 36e5 / 6e4);
  return h ? `in ${h}h ${mm}m` : `in ${mm}m`;
}

function renderTop() {
  const rp = profile?.rp || 0, tier = tierOf(rp);
  // Today's slate, or the next open one on a day with no NBA games.
  const today = days.has(etDay()) ? etDay() : nextOpenDate();
  const onToday = ui.view === 'night' && ui.sel === today;
  const nav = (view, label, extra = '') => `<button class="navlink ${ui.view === view ? 'on' : ''}" data-action="view" data-v="${view}" ${ui.view === view ? 'aria-current="page"' : ''} ${extra}>${label}</button>`;

function rankCard() {

  const into = rp - tier * 100;
  return `<div class="rank-card">
    <div class="rank-head">${avatarHtml(profile, 'sm')}${tierBadge(tier)}<button class="linkbtn" data-action="edit-name">Edit name</button></div>
    <div class="rank-rp"><b>${fmt(rp)}</b> RP</div>

    ${profile?.lastSkipRp < 0 && profile.lastSkip > (profile.lastNight || '') ? `<div class="rank-skip">Skipped ${dayLabel(profile.lastSkip)}: ${profile.lastSkipRp} RP</div>` : ''}
    <div class="rank-stats"><span><b>🔥 ${profile?.streak || 0}</b> streak</span><span><b>${profile?.wins || 0}–${profile?.losses || 0}</b> record</span><span><b>${cards.size}</b> cards</span></div>
  </div>`;
}

function streakBanner() {
  const scored = profile.streak || 0;
  const open = nextOpenDate();
  const inTonight = !!(open && entries.has(open));
  // Entered nights the sync hasn't scored yet count toward the streak you're on.
  const pending = [...entries.values()].filter(e => !e.finish && !e.scored && !e.invalid && days.has(e.date)).length;
  const streak = scored + pending;
  let next = streak + 1;
  while (!rewardFor(next)) next++;
  const away = next - streak, reward = rewardText(rewardFor(next));
  const lost = !streak && profile.lastStreak;
  const title = streak ? `🔥 ${streak}-night streak` : lost ? `Your ${profile.lastStreak}-night streak ended` : 'Start a streak';
  const night = open ? dayLabel(open).split(',')[0] : '';
  const line = !open ? `Next reward at ${next} nights: ${reward}. Enter the next slate when it’s posted.`
    : inTonight ? `You’re in for ${night}.${rewardFor(streak) ? ` That earns you ${rewardText(rewardFor(streak))} when the night is scored.` : ''} Next reward at ${next} nights: ${reward}.`
    : away === 1 ? `Enter ${night} to earn ${reward}.`
    : `Enter ${night} to ${streak ? `reach ${streak + 1} nights` : 'start your streak'}. ${away} nights to ${reward}.`;
  const last = profile.lastReward;
  const earned = last && last.date === profile.lastNight ? `<span class="st-chip won">Earned ${dayLabel(last.date).split(',')[0]}: ${rewardText(last)}</span>` : '';
  const momentNames = profile.lastMoments && profile.lastMoments.date === profile.lastNight ? (profile.lastMoments.ids || []).map(id => MOMENTS.find(m => m.id === id)).filter(Boolean) : [];
  const moments = momentNames.map(m => `<span class="st-chip won">New badge: ${m.icon} ${esc(m.name)}</span>`).join('');
  const savers = profile.savers ? `<span class="st-chip">Streak Saver × ${profile.savers}</span>` : '';
  // The last reward reached, the next few, and the 30-night badge while it's still ahead.
  const stops = [];
  for (let n = 1; stops.filter(x => x > streak).length < 3; n++) if (rewardFor(n)) stops.push(n);
  const passed = stops.filter(x => x <= streak).pop();
  const shown = [...stops.filter(x => x > streak), ...(passed ? [passed] : []), ...(streak < 30 ? [30] : [])];
  const ladderStops = [...new Set(shown)].sort((a, b) => a - b);
  const ladder = ladderStops.map(n => `<li class="${streak >= n ? 'done' : n === next ? 'next' : ''}"><b>${n}</b><span>${rewardText(rewardFor(n)).replace(/^a /, '').replace(' + a ', ' + ').replace('the streak badge', 'Badge')}</span></li>`).join('');
  return `<div class="st-top"><div><div class="st-title">${title}</div></div>
      <div class="st-chips">${earned}${moments}${savers}</div></div>
    <ol class="st-ladder" aria-label="Streak rewards">${ladder}</ol>`;
}

function renderSide() {
  if (!me.id || !profile?.name) { $('#side').innerHTML = ''; return; }
  const list = [...days.values()].sort((a, b) => a.date < b.date ? -1 : 1).map(d => {

      : !e ? (profile?.lastSkip === d.date && profile.lastSkipRp < 0 ? `<span class="badge lost">${profile.lastSkipRp} RP</span>` : '<span class="badge">—</span>')

      : e.scored ? `<span class="badge won">${f1(e.score)}</span>` : e.finish ? `<span class="badge ${e.rpDelta >= 0 ? 'won' : 'lost'}">${ordinal(e.finish)}</span>` : '<span class="badge">Final</span>';
    return `<button class="nav-item" data-action="sel" data-d="${d.date}" aria-pressed="${ui.view === 'night' && ui.sel === d.date}"><span class="gnum">${dateOf(d.date).getDate()}</span><span>${dayLabel(d.date)}</span>${badge}</button>`;

function slateCard(day) {
  const lockTxt = locked(day) ? (day.final ? 'All games final' : 'Lineups locked') : `Locks ${timeLabel(day.lockAt)} · ${until(day.lockAt)}`;
  const races = day.games.map(x => {
    const started = x.status !== 'STATUS_SCHEDULED', done = LIVE_DONE.has(x.status);
    return `<div class="race ${done ? 'done' : started ? 'in' : ''}"><b>${started ? `${x.awayScore}–${x.homeScore}` : timeLabel(x.tip)}</b><span>${esc(x.away)} @ ${esc(x.home)}</span>${started ? `<small>${esc(x.detail)}</small>` : ''}</div>`;
  }).join('');
  return `<div class="lockline"><span class="lock ${locked(day) ? 'locked' : ''}">${lockTxt}</span></div><div class="races" data-day="${day.date}">${races}<i class="sx" aria-hidden="true"></i></div>`;

// Redraws keep the schedule where the player scrolled it, on the same night.

function renderLineup() {
  const day = days.get(ui.sel), lu = ui.draft, m = pmap(day);
  const open = lu.filter(x => !x).length;
  const fillable = new Set(fillableSlots(lu, day)), isReady = ready(lu, day), links = linkStatus(lu, day);
  const legs = SLOTS.map((slot, i) => {
    const p = lu[i] && m.get(lu[i]);
    const notMine = p && !owns(p.id);
    return p ? `<li class="leg rc-${rarityOf(p.id)} ${notMine ? 'bad' : ''}"><button class="x" data-action="remove" data-i="${i}" aria-label="Remove ${esc(p.name)}">✕</button><div>
        <div class="leg-top"><span class="ptag">${slot}</span><b>${plink(p)}</b><span class="leg-sal">${starsHtml(p.stars)}</span></div>
        <div class="leg-sub"><span>${esc(p.team)} ${esc(p.opp)} · FPPG ${f1(p.avg)}${isOut(p) ? ' · <span class="inj out">Out</span>' : ''}${notMine ? ' · <span class="inj out">Not your card</span>' : ''}</span>
          <span class="leg-types">${boostChip(boostOn(i))}${rarityTag(rarityOf(p.id))}${typeChips(p.types, true)}${links.filter(l => l.on && l.ids.has(p.id)).map(l => `<span class="arch syn">✦ ${esc(l.sy.name)}</span>`).join('')}</span></div></div></li>`
      : `<li class="leg open ${fillable.has(i) ? '' : 'none'}"><span></span><div class="leg-top"><span class="ptag dim">${slot}</span><span>${fillable.has(i) ? SLOT_HINT[slot] : 'No card fits · scores nothing'}</span><span></span></div></li>`;
  }).join('');
  const proj = projected(lu, day);
  // Links: the ones on, then the ones a single archetype away, each with the players making it.
  const linkRow = l => {
    const who = l.parts.flatMap(p => p.who.map(w => `${esc(lastName(w.name))} <i>${esc(TYPES[p.t].name)}</i>`));
    const need = l.parts.filter(p => p.who.length < p.k).map(p => `${p.k - p.who.length > 1 ? p.k - p.who.length + ' more ' + TYPES[p.t].name + 's' : 'a' + (/^[AEIOU]/.test(TYPES[p.t].name) ? 'n ' : ' ') + TYPES[p.t].name}`);

  };
  const shown = [...links.filter(l => l.on), ...links.filter(l => !l.on && l.missing === 1 && l.ids.size)];
  const linksHtml = lu.some(Boolean) ? `<div class="links"><div class="links-h"><span>Links</span><small>${links.filter(l => l.on).length} on · whole-lineup boosts</small></div>
    ${shown.map(linkRow).join('') || `<p class="link-none">No links yet. ${SYNERGIES.map(sy => `${esc(sy.name)}: ${esc(sy.text.split(':')[0])}`).join(' · ')}.</p>`}</div>` : '';
  const entered = entries.has(ui.sel);
  const skipNote = !entered && profile.nights ? ` ${profile.savers ? 'Skipping tonight uses your Streak Saver.' : `Skipping tonight costs ${SKIP_PENALTY} RP and your streak.`}` : '';
  const wm = weekMatch(weekOf(ui.sel)), opp = wm?.sides.find(x => x.uid !== me.id);
  const info = lu.some(id => id && !owns(id)) ? 'Remove the players you don’t have a card for. They’d make this lineup invalid.'
    : !isReady ? `Fill the open slots to enter. ${fillable.size} to fill.${skipNote}`
    : `Entered for ${dayLabel(ui.sel)}${open ? ` with ${open} empty slot${open > 1 ? 's' : ''}` : ''}. ${wm ? `At ${timeLabel(day.lockAt)} it joins your week against ${esc(opp?.name || 'your opponent')}.` : `At ${timeLabel(day.lockAt)} you’ll be paired with a ${TIERS[tierOf(profile?.rp)]} player for the rest of the week.`}`;
  const cta = fillable.size ? `<button class="cta" data-action="auto">Auto-fill ${fillable.size} open slot${fillable.size > 1 ? 's' : ''}</button>`
    : ui.save === 'pending' ? '<button class="cta" disabled>Saving…</button>'
    : ui.save === 'err' ? '<button class="cta err" disabled>Couldn’t save. Make any change to retry.</button>'
    : !lu.some(Boolean) ? '<button class="cta" disabled>No cards play tonight</button>'
    : entered ? `<button class="cta ok" disabled>✓ Entered · edit until ${timeLabel(day.lockAt)}</button>` : '<button class="cta" disabled>Saving…</button>';
  renderDock(lu, proj, open, day);
  $('#lineup').innerHTML = `
    <div class="slip-head"><span class="count">${6 - open}</span><h3>Squad</h3><button class="sheet-x" data-action="sheet-close" aria-label="Close lineup">✕</button></div>
    <div class="seg"><span class="on">${esc(profile.name)}</span><span>${TIERS[tierOf(profile.rp)]} · weekly 1v1</span></div>
    <div class="slip-foot slip-sum">
      <dl class="totals sum-big"><div><dt>Projected</dt><dd>${f1(proj)}</dd></div><div><dt>Cards</dt><dd>${6 - open}/6</dd></div><div><dt>Stars</dt><dd>${lu.reduce((a, id) => a + (id ? m.get(id)?.stars || 0 : 0), 0)}★</dd></div></dl>
      <div class="ctarow"><button class="trash" data-action="clear" aria-label="Clear lineup" ${lu.some(Boolean) ? '' : 'disabled'}>${TRASH}</button>${cta}</div>
      <div class="info">${info}</div>
    </div>
    ${linksHtml}
    <ul class="legs">${legs}</ul>`;
}

/* ---------- Group results ---------- */
// Nights played in groups of 10 before battles: rank points by finish.
const RP_BY_FINISH = [30, 20, 20, 5, 5, -5, -5, -15, -15, -15];
function groupRows(day) {
  const res = new Map((group.results || []).map(r => [r.key, r]));
  const rows = group.members.map(mb => {
    const rows = scoreRows(mb.ids, mb.captain, day);
    return { ...mb, rows, total: total(rows), best: Math.max(0, ...rows.map(r => r.fp)), res: res.get(mb.key) };
  });
  if (group.scored) rows.sort((a, b) => (a.res?.finish || 99) - (b.res?.finish || 99));
  else rows.sort((a, b) => b.total - a.total || b.best - a.best || (a.at ?? Infinity) - (b.at ?? Infinity));
  return rows;
}

// Where a player's night stands, from his game's status: live, final, did not play, game off or upcoming.
function playerState(r, day) {
  const g = day.games.find(x => x.away === r.p.team || x.home === r.p.team);
  if (!g) return { kind: 'final', text: 'No game' };
  if (g.status === 'STATUS_SCHEDULED') return { kind: 'soon', text: `Starts ${timeLabel(g.tip)}` };
  if (LIVE_DONE.has(g.status)) {
    if (g.status !== 'STATUS_FINAL') return { kind: 'off', text: 'Game off' };
    return r.line ? { kind: 'final', text: 'Final' } : { kind: 'off', text: 'Did not play' };
  }
  return { kind: 'live', text: r.line ? `Live · ${g.detail}` : `Live · hasn’t played yet` };
}

function lineupProgress(rows, day) {
  const n = { live: 0, final: 0, soon: 0, off: 0 };
  rows.forEach(r => n[playerState(r, day).kind]++);
  if (n.live + n.soon === 0) return 'All players finished';
  return [n.live && `${n.live} live`,n.final + n.off && `${n.final + n.off} finished`, n.soon && `${n.soon} to come`].filter(Boolean).join(' · ');
}

function lineupDetail(mb, day) {
  return mb.rows.map(r => {
    const l = r.line, st = playerState(r, day);
    const stat = l ? `<span class="sep">|</span>${l[1]} PTS · ${l[2]} REB · ${l[3]} AST · ${l[4]} STL · ${l[5]} BLK · ${l[6]} TO · ${l[0]} MIN` : '';
    return `<div class="runner sub" data-pid="${esc(r.p.id)}">${face(r.p)}
      <div><div class="r-name"><span class="ptag">${r.slot}</span>${plink(r.p)}${r.cap ? '<span class="ctag">★ Captain</span>' : ''}<span class="pstate ${st.kind}">${esc(st.text)}</span></div><div class="r-sub">${esc(r.p.team)} ${esc(r.p.opp)}${stat}</div></div>
      <div class="r-act"><span class="sc ${l ? '' : 'zero'} ${r.cap ? 'capsc' : ''}">${l ? f1(r.fp) : '—'}</span><span class="r-trail">${r.cap && l ? `${f1(r.base)} × 1.5` : starsHtml(r.p.stars)}</span></div></div>`;
  }).join('');
}

function groupView(day) {
  const rows = groupRows(day);
  const mine = rows.findIndex(r => r.uid === me.id);
  const my = rows[mine];
  if (ui.open == null) ui.open = me.id;
  const board = rows.map((r, i) => {
    const d = r.res?.rpDelta;
    const delta = group.scored ? (r.bot ? '' : `<span class="badge ${d >= 0 ? 'won' : 'lost'}">${d >= 0 ? '+' : ''}${d} RP</span>`)
      : (r.bot ? '' : `<span class="badge">${RP_BY_FINISH[i] >= 0 ? '+' : ''}${RP_BY_FINISH[i]} if final</span>`);
    const isOpen = ui.open === r.key;
    return `<div class="gboard-row ${r.uid === me.id ? 'me' : ''}">
      <button class="grow" data-action="toggle-row" data-k="${esc(r.key)}" aria-expanded="${isOpen}">
        <span class="gpos">${i + 1}</span>
        ${avatarHtml(r.bot ? { name: r.name } : peer(r.uid) || { name: r.name }, 'sm')}<span class="gname">${esc(r.name)}${r.bot ? '' : badgeMark(peer(r.uid))}${r.bot ? '<span class="bot">Computer</span>' : ''}${r.uid === me.id ? '<span class="you">You</span>' : ''}<small class="gprog">${lineupProgress(r.rows, day)}</small></span>
        ${delta}
        <span class="sc">${f1(r.total)}</span>
      </button>
      ${isOpen ? `<div class="gdetail">${lineupDetail(r, day)}</div>` : ''}
    </div>`;
  }).join('');
  const head = group.scored
    ? `You finished ${ordinal(mine + 1)} of ${rows.length}`
    : day.final ? 'Final scores are in. Ranks update on the next sync.'
    : `You’re ${ordinal(mine + 1)} of ${rows.length} right now`;
  const updated = day.updatedAt ? `Stats as of ${new Date(day.updatedAt).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' })}.` : '';
  return `<section class="panel">
    <div class="list-head"><div><div class="eyebrow">${tierBadge(group.tier)} Group ${esc(group.gid.split('-').pop())} · ${dayLabel(day.date)}</div><h2>${head}</h2>
      <p class="sub">${group.scored ? '' : 'Live scores refresh every minute. '}${updated} Tap a row to see that lineup.</p></div>
      ${my ? `<span class="sc big">${f1(my.total)}</span>` : ''}</div>
    <div class="gboard">${board}</div>
  </section>`;
}

/* ---------- Battles ---------- */

const catVal = (key, v) => key === 'fgp' ? (v ? f1(v) + '%' : '—') : f1(v);

function battleSlot(sl, day, side) {
  if (!sl?.id) return `<div class="bs none ${side}"><span class="bs-name">Empty slot</span><span class="bs-line">Scores nothing</span></div>`;
  const p = pmap(day).get(sl.id) || { id: sl.id, name: 'Unknown player', team: '', pos: '', stars: 0 };
  const line = day.results?.[sl.id], st = playerState({ p, line }, day);
  const stat = line ? `${line[1]} PTS · ${line[2]} REB · ${line[3]} AST · ${line[4]} STL · ${line[5]} BLK · ${line[7]} 3PM` : '';
  return `<div class="bs ${side} rc-${sl.rarity || 'common'}" data-pid="${esc(p.id)}">${face(p)}
    <div class="bs-who"><div class="bs-name">${plink(p)}</div>
      <div class="bs-tags">${boostChip(sl.boost)}${rarityTag(sl.rarity)}${typeChips(sl.types)}<span class="pstate ${st.kind}">${esc(st.text)}</span></div>
      ${stat ? `<div class="bs-line">${stat}</div>` : ''}</div>
    <span class="sc ${line ? '' : 'zero'}">${line ? f1(fpOf(line)) : '—'}</span></div>`;
}

/* ---------- Weekly matchups ---------- */
const weekLabel = w => { const ds = weekDates(w), md = d => dateOf(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); return `${md(ds[0])} – ${md(ds[6])}`; };
const weekMatch = week => myMatches.find(m => m.week === week) || null;

// A matchup's week so far, from this player's side ("a" is always me). Nights the page has loaded are worked
// out from their box scores, live during games; earlier nights use the totals the sync stored.
function weekState(m) {
  const k = Math.max(0, m.sides.findIndex(x => x.uid === me.id));
  const nights = Object.keys(m.nights || {}).sort().map(date => {
    const n = m.nights[date], d = days.get(date), live = d && locked(d);
    const tot = n.sides.map((x, j) => !x.slots ? null : live ? sideTotals(x.slots, n.sides[1 - j].slots || [], d.results || {}) : x.tot);
    const du = live ? duelsOf(n.sides[0].slots || [], n.sides[1].slots || [], d.results || {}).wins : n.duels || [0, 0];
    return { date, slots: [n.sides[k].slots, n.sides[1 - k].slots], tot: [tot[k], tot[1 - k]], duels: [du[k] || 0, du[1 - k] || 0] };
  });
  const duels = nights.reduce((s, n) => [s[0] + n.duels[0], s[1] + n.duels[1]], [0, 0]);
  const r = decide(addTotals(nights.map(n => n.tot[0])), addTotals(nights.map(n => n.tot[1])), duels);
  return { k, mine: m.sides[k], opp: m.sides[1 - k], nights, r };
}

function weekHead(m, w) {
  const [a, b] = w.r.wins;
  if (m.scored) return w.r.winner === 0 ? `You won the week ${a}–${b}` : w.r.winner === 1 ? `You lost the week ${a}–${b}` : `The week ended level, ${a}–${b}`;
  return a > b ? `You lead ${a}–${b}` : a < b ? `You trail ${a}–${b}` : `Level at ${a}–${b}`;
}
const rpBadge = (m, w) => m.scored && w.mine.rpDelta != null
  ? `<span class="badge ${w.mine.rpDelta >= 0 ? 'won' : 'lost'}">${w.mine.rpDelta >= 0 ? '+' : ''}${w.mine.rpDelta} RP</span>`
  : `<span class="badge">Win +${RP_WIN} · loss ${RP_LOSS} RP</span>`;

function catRows(w, mini) {
  return CATS.map((c, i) => {
    const x = w.r.cats[i], cls = x.w === 0 ? 'w-me' : x.w === 1 ? 'w-them' : '';
    return mini
      ? `<div class="mc ${cls}"><span>${c.name}</span><b><em>${catVal(c.key, x.a)}</em><i>–</i>${catVal(c.key, x.b)}</b></div>`
      : `<div class="cat ${cls}"><span class="cv a">${catVal(c.key, x.a)}</span><span class="cn">${c.name}</span><span class="cv b">${catVal(c.key, x.b)}</span></div>`;
  }).join('');
}

// Monday to Sunday: each side's fantasy points per night. Nights on the page can be opened.
function nightsStrip(m, w) {
  const by = new Map(w.nights.map(n => [n.date, n]));
  const pts = x => x ? f1(x.fp) : '—';
  return `<div class="wk-nights">${weekDates(m.week).map(d => {
    const n = by.get(d), day = days.get(d), sel = d === ui.sel && ui.view === 'night';
    const lead = n && n.tot[0] && n.tot[1] ? (n.tot[0].fp >= n.tot[1].fp ? 'up' : 'down') : '';
    const inner = `<span class="wn-d">${dateOf(d).toLocaleDateString('en-US', { weekday: 'short' })}</span>`
      + (n ? `<b>${pts(n.tot[0])}</b><small>${pts(n.tot[1])}</small>` : `<small>${day ? (locked(day) ? '—' : 'Open') : d < etDay() ? '—' : 'Soon'}</small>`);
    return day ? `<button class="wn ${lead} ${sel ? 'on' : ''}" data-action="sel" data-d="${d}" aria-pressed="${sel}">${inner}</button>` : `<div class="wn ${lead}">${inner}</div>`;
  }).join('')}</div>`;
}

// The week at a glance above an open night's cards, so the lineup can chase the categories being lost.
function weekPanel() {
  const week = weekOf(ui.sel), m = weekMatch(week);
  // No matchup yet (it's made when the night locks): nothing to show.
  if (!m) return '';
  const w = weekState(m);
  return `<section class="panel wk"><div class="list-head"><div><div class="eyebrow">${tierBadge(m.tier)} Week of ${weekLabel(m.week)} · vs ${esc(w.opp.name)}</div><h2>${weekHead(m, w)}</h2>
    <p class="sub">Your totals first. Set tonight’s cards to win the categories you’re losing.</p></div>${rpBadge(m, w)}</div>
    <div class="cats mini">${catRows(w, true)}</div>${nightsStrip(m, w)}</section>`;
}

// On a locked night, Today just points to the Matchup page, which has the full battle.
// Tonight's lineup once it has locked: the same court, read-only, with each player's fantasy points so far.
function lockedCourt(day, e) {
  const m = pmap(day), live = day.games.some(g => g.status !== 'STATUS_SCHEDULED' && !LIVE_DONE.has(g.status));
  const spots = SLOTS.map((slot, i) => {
    const id = e.ids?.[i], p = id && m.get(id), [x, y] = SPOTS[i];
    if (!p) return `<div class="spot empty" style="--x:${x}%;--y:${y}%"><span class="slot-card"><span>Empty</span></span><span class="spot-tag">${spotTag(slot)}</span></div>`;
    const line = day.results?.[id], st = playerState({ p, line }, day);
    const chip = line ? `${f1(fpOf(line))} FP` : st.kind === 'soon' ? esc(st.text) : st.kind === 'off' ? esc(st.text) : '0 FP';
    return `<div class="spot filled" style="--x:${x}%;--y:${y}%"><span class="spot-boost spot-fp ${st.kind}">${chip}</span>
      ${cardHtml(cards.get(id) || { pid: id, rarity: 'common', name: p.name, team: p.team, pos: p.pos })}<span class="spot-tag">${spotTag(slot)}</span></div>`;
  }).join('');
  return `<section class="court-panel lineup-stage" aria-labelledby="lineup-h"><div class="court-bar"><h2 id="lineup-h">Lineup</h2>
      <span class="court-lock">${dayLabel(day.date).split(',')[0]} · ${live ? '<span class="mu-live">Live</span>' : day.final ? 'Final' : 'Locked'}</span></div>
    <div class="court">${COURT_SVG}${spots}</div></section>`;
}

// On a locked night, Today shows just the week's score; tapping it opens the Matchup page for the full battle.
function weekView(day, m) {
  const w = weekState(m), [a, b] = w.r.wins;
  const live = !m.scored && day.games?.some(g => g.status !== 'STATUS_SCHEDULED' && !LIVE_DONE.has(g.status));
  const who = (sd, mine) => `<span class="ms-who ${mine ? 'me' : ''}">${avatarHtml(sd.bot ? { name: sd.name } : peer(sd.uid) || { name: sd.name }, 'md')}<b>${esc(sd.name)}</b></span>`;
  return `<button class="ms-card" data-action="mu-open" data-d="${day.date}" aria-label="Open the matchup: ${a} to ${b} in categories">
    <span class="ms-top">${live ? '<span class="mu-live">Live</span>' : m.scored ? 'Final' : `Week of ${weekLabel(m.week)}`}<span class="ms-go">Matchup ›</span></span>
    <span class="ms-board">${who(w.mine, true)}<span class="ms-score"><b class="${a >= b ? 'lead' : ''}">${a}</b><i>–</i><b class="${b >= a ? 'lead' : ''}">${b}</b></span>${who(w.opp, false)}</span>
  </button>`;
}


/* ---------- Matchup page: the week's scoreboard, the categories and the two lineups card against card ---------- */
// This week's matchup, or the latest one if there's none yet this week.
const muWeek = () => weekMatch(weekOf(etDay())) || [...myMatches].sort((a, b) => String(b.week).localeCompare(String(a.week)))[0] || null;
// The night to show: the one picked, else tonight, else the latest night with lineups.
function muNight(m) {
  const dates = Object.keys(m.nights || {}).sort();
  return dates.includes(ui.muNight) ? ui.muNight : dates.includes(etDay()) ? etDay() : dates[dates.length - 1] || null;
}
// Nights older than the page's few loaded days are fetched once when the matchup page shows them.
const oldDays = new Map(), oldDaysAsked = new Set();
function dayFor(date) {
  if (!date) return null;
  if (days.has(date)) return days.get(date);
  if (oldDays.has(date)) return oldDays.get(date);
  if (db && !oldDaysAsked.has(date)) { oldDaysAsked.add(date); db.doc('days/' + date).get().then(x => { if (x.exists) { oldDays.set(date, x.data()); if (ui.view === 'matchup') { ui.sig = ''; render(); } } }).catch(() => {}); }
  return null;
}
const MU_STATS = [['PTS', 1], ['REB', 2], ['AST', 3], ['STL', 4], ['BLK', 5], ['3PM', 7], ['FG', 'fg'], ['FTM', 10], ['TO', 6]];
function muSide(sl, day, side, up = false) {
  if (!sl?.id) return `<div class="mu-side ${side}"><div class="mu-card"><div class="mu-empty">Empty slot</div></div><div class="mu-stats"><span class="pstate off">Scores nothing</span></div></div>`;
  const p = (day && pmap(day).get(sl.id)) || { id: sl.id, ...roster.get(sl.id) };
  const line = day?.results?.[sl.id], st = day ? playerState({ p, line }, day) : { kind: 'final', text: 'Final' };
  const cells = MU_STATS.map(([k, i]) => `<span><b>${!line ? '–' : i === 'fg' ? `${line[8] || 0}/${line[9] || 0}` : line[i] || 0}</b><i>${k}</i></span>`).join('');
  return `<div class="mu-side ${side} ${up ? 'up' : ''}">
    <div class="mu-card">${sl.boost ? boostChip(sl.boost) : ''}${cardHtml({ pid: sl.id, rarity: sl.rarity || 'common', name: p.name, team: p.team, pos: p.pos, level: 1 + (sl.lv || []).length, picks: sl.lv || [], ...(sl.star ? { star: { stat: sl.star } } : {}) })}</div>
    <div class="mu-stats"><div class="mu-st-top"><span class="pstate ${st.kind}">${esc(st.text)}</span><b class="mu-fp">${line ? f1(fpOf(line)) : '–'}<small>FP</small></b></div>
      <div class="mu-grid ${line ? '' : 'none'}">${cells}</div>${line ? `<span class="mu-min">${line[0] || 0} min</span>` : ''}</div></div>`;
}
function matchupView() {
  const m = muWeek();
  if (!m) return notice('Matchup', 'No matchup yet', `<p>You’re paired with an opponent for the week when your first lineup locks. Set a lineup and check back after tip-off.</p>${nextOpenDate() ? `<div class="row"><button class="btn primary" data-action="sel" data-d="${nextOpenDate()}">Set a lineup</button></div>` : ''}`);
  const w = weekState(m), date = muNight(m);
  const n = w.nights.find(x => x.date === date), day = dayFor(date);
  const liveNow = !!day && !m.scored && day.games.some(g => g.status !== 'STATUS_SCHEDULED' && !LIVE_DONE.has(g.status));
  const status = m.scored ? 'Final' : liveNow ? '<span class="mu-live">Live</span>' : 'In progress';
  const who = (sd, mine) => {
    const u = sd.bot ? { name: sd.name } : peer(sd.uid) || { name: sd.name };
    return `<div class="mu-who">${avatarHtml(u, 'lg')}<b>${esc(sd.name)}${sd.bot ? '' : badgeMark(peer(sd.uid))}</b>${mine ? '<span class="you">You</span>' : sd.bot ? '<span class="bot">Computer</span>' : tierBadge(tierOf(sd.rpBefore))}</div>`;
  };
  const [a, b] = w.r.wins;
  const hero = `<section class="mu-hero">
    <div class="mu-eyebrow">${tierBadge(m.tier)}<span>Week of ${weekLabel(m.week)}</span><span>·</span>${status}</div>
    <div class="mu-board">${who(w.mine, true)}<div class="mu-score"><b class="${a >= b ? 'lead' : ''}">${a}</b><span>–</span><b class="${b >= a ? 'lead' : ''}">${b}</b><small>Categories won</small></div>${who(w.opp, false)}</div>
    <div class="mu-duels"><b>${w.r.duels[0]}</b><span>Duels won</span><b>${w.r.duels[1]}</b></div></section>`;
  // Categories: the week's totals (what decides the matchup), or just the night on show.
  const scope = ui.muCats === 'night' && n ? 'night' : 'week', empty = addTotals([]);
  const r = scope === 'night' ? decide(n.tot[0] || empty, n.tot[1] || empty, n.duels) : w.r;
  const short = d => dateOf(d).toLocaleDateString('en-US', { weekday: 'short' });
  const cats = CATS.map((c, i) => {
    const x = r.cats[i], tot = x.a + x.b, share = !tot ? .5 : c.low ? x.b / tot : x.a / tot;
    return `<div class="mu-cat ${x.w === 0 ? 'w-me' : x.w === 1 ? 'w-them' : ''}"><span class="mu-v a">${catVal(c.key, x.a)}</span>
      <div class="mu-mid"><span class="mu-cn">${c.name}${c.low ? ' · fewer wins' : ''}</span><div class="mu-bar"><i style="width:${(share * 100).toFixed(1)}%"></i></div></div><span class="mu-v b">${catVal(c.key, x.b)}</span></div>`;
  }).join('');
  const catPanel = `<section class="panel mu-cats"><div class="list-head"><div><h2>Categories <span class="mu-mini">${r.wins[0]}–${r.wins[1]}</span></h2></div>
      ${n ? `<div class="seg-t"><button data-action="mu-cats" data-s="week" aria-pressed="${scope === 'week'}">Week</button><button data-action="mu-cats" data-s="night" aria-pressed="${scope === 'night'}">${short(n.date)}</button></div>` : ''}</div>
    <div class="mu-catlist">${cats}</div></section>`;
  // The night's two lineups, slot against slot, with each player's box score.
  const tabs = w.nights.map(x => `<button class="mu-tab" data-action="mu-night" data-d="${x.date}" aria-pressed="${x.date === date}"><span>${short(x.date)}</span><b>${x.tot[0] ? f1(x.tot[0].fp) : '–'} · ${x.tot[1] ? f1(x.tot[1].fp) : '–'}</b></button>`).join('');
  const links = list => synergiesOf(list || []).map(sy => `<span class="arch syn" title="${esc(sy.text)}">✦ ${esc(sy.name)} <b>${linkFx(sy)}</b></span>`).join('') || '<span class="dimtxt">No links</span>';
  const duel = n && day ? duelsOf(n.slots[0] || [], n.slots[1] || [], day.results || {}) : null;
  const rows = n ? SLOTS.map((slot, i) => {
    const sa = n.slots[0]?.[i] || null, sb = n.slots[1]?.[i] || null, dw = duel?.slots[i];
    const marks = [...countersOn(sa, sb).map(c => ({ c, mine: true })), ...countersOn(sb, sa).map(c => ({ c, mine: false }))];
    return `<div class="mu-row"><div class="mu-slot-col"><span class="mu-slot">${spotTag(slot)}</span>${dw === 0 ? '<span class="mu-duel me" title="You won this duel">◀</span>' : dw === 1 ? '<span class="mu-duel them" title="They won this duel">▶</span>' : ''}</div>${muSide(sa, day, 'a', dw === 0)}${muSide(sb, day, 'b', dw === 1)}
      ${marks.length ? `<div class="ctr">${marks.map(x => `<span class="ctr-i ${x.mine ? 'good' : 'bad'}">${esc(x.c.text)}${x.mine ? '' : ' (theirs)'}</span>`).join('')}</div>` : ''}</div>`;
  }).join('') : '';
  const face = `<section class="panel mu-face"><div class="list-head"><div><h2>Face-off${n ? ` · ${dayLabel(n.date).split(',')[0]}` : ''}</h2>
      <p class="sub">${n ? `Duels <b>${n.duels[0]}–${n.duels[1]}</b>` : 'Lineups show here once a night locks.'}</p></div>
      ${n && n.duels[0] === SLOTS.length ? '<span class="badge won">Sweep!</span>' : ''}</div>
    ${tabs ? `<div class="mu-tabs">${tabs}</div>` : ''}
    ${n ? `<div class="mu-links"><div>${links(n.slots[0])}</div><div>${links(n.slots[1])}</div></div><div class="mu-rows">${rows}</div>` : ''}</section>`;
  return hero + catPanel + face;
}

// Center-crops to a small square. Redrawing also drops photo metadata such as location.
async function uploadAvatar(file) {
  if (!file.type.startsWith('image/') || file.type === 'image/svg+xml') return toast('Choose a JPG, PNG or WebP image.');
  if (file.size > 15 * 1024 * 1024) return toast('That image is over 15 MB. Choose a smaller one.');
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch (err) { return toast('That image couldn’t be read. Try a JPG or PNG.'); }
  const c = document.createElement('canvas');
  c.width = c.height = AVATAR_PX;
  const side = Math.min(bmp.width, bmp.height);
  const g = c.getContext('2d');
  g.fillStyle = '#161A20';
  g.fillRect(0, 0, AVATAR_PX, AVATAR_PX);
  g.drawImage(bmp, (bmp.width - side) / 2, (bmp.height - side) / 2, side, side, 0, 0, AVATAR_PX, AVATAR_PX);
  bmp.close?.();
  let url = '';
  for (const q of [0.82, 0.7, 0.55, 0.4]) { url = c.toDataURL('image/jpeg', q); if (url.length <= AVATAR_MAX) break; }
  if (url.length > AVATAR_MAX || !AVATAR_RE.test(url)) return toast('That image couldn’t be shrunk enough. Try a different one.');
  saveProfile({ avatar: url }, 'Picture updated.');
}
