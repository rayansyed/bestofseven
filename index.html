<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Best of 7 NBA</title>
<meta name="description" content="Ranked NBA fantasy: draft six real players on a star budget any night you like and climb from Bronze to Elite.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
a { color: var(--accent-2); }
.series-item .gnum { width: 34px; height: 34px; font-size: 11px; }
/* Layout: a sportsbook-style app. Top bar across; left rail lists the seven series games and position filters;
   the center holds the night's hero (slate chips) and the player list with star-rating "odds" buttons; the right rail is the lineup slip.
   Deliberately one dark look for every viewer. */
:root {
  --bg: #0E1014; --panel: #161A20; --panel-2: #1D2129; --chip: #242A33; --chip-2: #2C333E; --line: #262B34;
  --ink: #F4F6F8; --muted: #959EAA; --dim: #6B7480;
  --accent: #1D9BF0; --accent-2: #4FB3F6; --accent-soft: rgba(29,155,240,.16);
  --teal: #34D3BD; --teal-soft: rgba(52,211,189,.12); --tag: #E3EF5B; --tag-ink: #1B1E0A;
  --good: #4ADE80; --bad: #F87171; --live: #FBBF24;
  --pill: #FFFFFF; --pill-ink: #0E1014;
  --a: #1D9BF0; --b: #FB923C;
  --sans: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .odds, dd, .tot, .sc { font-variant-numeric: tabular-nums; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
h2 { font-size: 19px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
h3 { font-size: 19px; font-weight: 700; }
p { max-width: 65ch; }

.app { max-width: 1480px; margin: 0 auto; display: grid; grid-template-columns: 228px minmax(0, 1fr) 350px; gap: 16px; align-items: start;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; }

/* Top bar */
.topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 28px; padding-block: 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); }
.brand { font-weight: 800; font-size: 21px; letter-spacing: -.02em; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.brand .seven { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: #fff; transform: skewX(-10deg); }
.topnav { display: flex; gap: 6px; flex-wrap: wrap; }
.navlink { border: 0; border-bottom: 2px solid transparent; background: transparent; padding: 8px 12px; font-weight: 700; font-size: 14px; color: var(--muted); white-space: nowrap; }
.navlink:hover { color: var(--ink); }
.top-right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tchip { background: var(--panel-2); border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.tdot { width: 9px; height: 9px; border-radius: 50%; background: var(--a); }
.tdot.b { background: var(--b); }
.btn { border: 0; border-radius: 10px; padding: 9px 16px; font-weight: 700; font-size: 13px; background: var(--chip); color: var(--ink); white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--chip-2); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* Left rail */
.side { display: grid; gap: 4px; position: sticky; top: 86px; }
.side-label { font-size: 12px; color: var(--muted); padding: 14px 12px 6px; }
.side-status { font-size: 12px; color: var(--ink); padding: 0 12px 6px; font-weight: 600; }
.nav-item { border: 0; background: transparent; width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-weight: 600; font-size: 13.5px; color: var(--ink); }
.nav-item:hover:not(:disabled) { background: var(--panel-2); }
.nav-item[aria-pressed=true] { background: var(--panel-2); }
.nav-item:disabled { color: var(--dim); cursor: default; }
.gnum { width: 22px; height: 22px; border-radius: 6px; background: var(--chip); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.gnum.wa { background: var(--a); color: #fff; } .gnum.wb { background: var(--b); color: #1a0d03; }
.badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.badge.tag { background: rgba(227,239,91,.16); color: var(--tag); }
.badge.live { background: rgba(251,191,36,.16); color: var(--live); }
.badge.draft { background: var(--accent-soft); color: var(--accent-2); }
.badge.won { background: rgba(74,222,128,.14); color: var(--good); }
.badge.lost { background: rgba(248,113,113,.14); color: var(--bad); }
.side-note { font-size: 12px; color: var(--muted); padding: 4px 12px; line-height: 1.6; }

/* Center */
main { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--panel); border-radius: 16px; min-width: 0; }
.hero-card { position: relative; overflow: hidden; padding: 24px 22px 18px; display: grid; gap: 16px; background: var(--panel); border-radius: 16px; isolation: isolate; }
.hero-card::before { content: ""; position: absolute; inset: 0 0 0 38%; z-index: -1; opacity: .9;
  background:
    linear-gradient(90deg, var(--panel) 0%, transparent 45%),
    linear-gradient(118deg, transparent 0 30%, rgba(29,155,240,.55) 30% 34%, transparent 34% 44%, rgba(251,146,60,.45) 44% 47%, transparent 47% 60%, rgba(52,211,189,.35) 60% 62%, transparent 62%),
    radial-gradient(60% 90% at 80% 30%, rgba(29,155,240,.35), transparent 70%),
    radial-gradient(40% 70% at 95% 90%, rgba(251,146,60,.3), transparent 70%); filter: blur(6px); }
.hero-sub { color: var(--muted); font-size: 13.5px; margin-top: 6px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.tab { border: 0; background: transparent; padding: 9px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--ink); }
.tab:hover { background: var(--chip); }
.tab[aria-pressed=true] { background: var(--accent); color: #fff; }
.tabs .search { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.tabs input, .tabs select { background: rgba(14,16,20,.7); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 0; }
.tabs input { width: 200px; max-width: 100%; }
.tabs select option { background: var(--panel); }
.races { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.race { flex: 0 0 auto; min-width: 104px; text-align: center; padding: 10px 12px; border-radius: 10px; display: grid; gap: 2px; background: rgba(36,42,51,.6); }
.race b { font-size: 15px; font-weight: 700; }
.race span { font-size: 12.5px; color: var(--muted); }
.race small { font-size: 11px; color: var(--live); font-weight: 700; }
.race.done small { color: var(--muted); }
.lockline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.lock { display: inline-flex; gap: 8px; align-items: center; background: var(--chip); padding: 9px 14px; border-radius: 10px; font-weight: 700; font-size: 13px; }
.lock::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.lock.locked::before { background: var(--live); }

.list-head { padding: 20px 22px 8px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.list-head .sub { color: var(--muted); font-size: 13.5px; margin-top: 6px; }
.runner { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 16px 22px; border-top: 1px solid var(--line); }
.list-head + .runner, .list-head + div > .runner:first-child { border-top: 0; }
.jersey { width: 36px; height: 36px; }
.r-name { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.r-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.r-sub .sep { color: var(--dim); margin: 0 6px; }
.r-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip { background: var(--chip); border-radius: 7px; padding: 3px 8px; font-size: 12px; font-weight: 600; color: #C9D0D8; }
.inj { font-size: 10px; font-weight: 800; letter-spacing: .04em; padding: 2px 6px; border-radius: 5px; text-transform: uppercase; }
.inj.out { background: rgba(248,113,113,.18); color: var(--bad); }
.inj.gtd { background: rgba(251,191,36,.16); color: var(--live); }
.r-act { display: grid; justify-items: end; gap: 6px; }
.odds { min-width: 108px; height: 46px; border-radius: 10px; border: 0; background: transparent; color: var(--tag); font-weight: 800; font-size: 16px; padding: 0 10px; text-align: right; }
.odds:hover { background: var(--chip); }
.odds.on { color: var(--good); }
.odds.on:hover { background: var(--chip-2); }
.runner.cant .odds:not(.on) { opacity: .4; }
.r-trail { font-size: 12px; color: var(--muted); }
.r-trail b { color: var(--ink); font-weight: 600; }
.runner.in { background: linear-gradient(90deg, var(--accent-soft), transparent 60%); }
.more { padding: 14px; text-align: center; border-top: 1px solid var(--line); }
.empty { padding: 28px 22px; color: var(--muted); text-align: center; }
.legend { font-size: 12px; color: var(--muted); padding: 0 4px; line-height: 1.6; }

.finals { display: flex; gap: 14px; flex-wrap: wrap; }
.final { background: rgba(36,42,51,.65); border-radius: 12px; padding: 14px 18px; display: grid; gap: 2px; min-width: 160px; }
.final .tot { font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
.final.a .tot { color: var(--a); } .final.b .tot { color: var(--b); }
.final.lose .tot { opacity: .5; }
.final small { color: var(--muted); font-weight: 600; font-size: 12.5px; display: flex; align-items: center; gap: 8px; }
.sc { min-width: 56px; color: var(--ink); font-weight: 800; font-size: 18px; text-align: right; }
.sc.zero { color: var(--muted); }

/* Right rail: lineup slip */
.slip { position: sticky; top: 86px; }
.slip-card { background: var(--panel); border-radius: 16px; overflow: hidden; }
.slip-head { padding: 18px 18px 12px; display: flex; align-items: center; gap: 10px; }
.count { width: 26px; height: 26px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.seg { display: flex; gap: 6px; padding: 0 18px 14px; flex-wrap: wrap; }
.seg span { padding: 7px 12px; border-radius: 9px; font-weight: 600; font-size: 13px; background: transparent; color: var(--muted); }
.seg span.on { background: var(--accent); color: #fff; }
.seg span.on.b { background: var(--b); color: #1a0d03; }
.legs { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.leg { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 13px 18px; border-bottom: 1px solid var(--line); align-items: start; }
.leg .x { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--chip-2); background: transparent; color: var(--muted); font-size: 12px; line-height: 1; display: grid; place-items: center; padding: 0; margin-top: 1px; }
.leg .x:hover { color: var(--bad); border-color: var(--bad); }
.leg-top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.leg-top b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.leg-sal { font-weight: 800; }
.stars { letter-spacing: 1px; white-space: nowrap; }
.stars i { font-style: normal; opacity: .22; }
.odds .stars { font-size: 17px; }
.leg-sal .stars, .r-trail .stars { font-size: 13px; color: var(--tag); }
.leg-sal .stars i { color: var(--ink); }
.leg-sub { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.leg-sub b { color: var(--tag); }
.capbtn { border: 1px solid var(--chip-2); background: transparent; color: var(--muted); border-radius: 7px; padding: 3px 8px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.capbtn:hover { border-color: var(--tag); color: var(--tag); }
.capbtn.on { background: var(--tag); border-color: var(--tag); color: var(--tag-ink); }
.leg.cap { background: linear-gradient(90deg, rgba(227,239,91,.08), transparent 70%); }
.ctag { font-size: 10px; font-weight: 800; letter-spacing: .04em; padding: 2px 6px; border-radius: 5px; background: var(--tag); color: var(--tag-ink); text-transform: uppercase; }
.sc.capsc { color: var(--tag); }
.leg-sub { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.ptag { background: var(--tag); color: var(--tag-ink); border-radius: 5px; padding: 1px 6px; font-size: 11px; font-weight: 800; min-width: 26px; text-align: center; }
.ptag.dim { background: var(--chip); color: var(--muted); }
.leg.open { color: var(--dim); }
.leg.open .leg-top span:last-child { font-style: italic; }
.slip-foot { padding: 16px 18px 18px; display: grid; gap: 14px; }
.capbar { height: 6px; border-radius: 4px; background: var(--chip); overflow: hidden; }
.capbar i { display: block; height: 100%; width: var(--w); background: var(--accent); transition: width .25s ease; }
.totals { margin: 0; display: grid; gap: 10px; }
.totals div { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.totals dt { color: var(--muted); }
.totals dd { margin: 0; font-weight: 800; }
.info { display: flex; gap: 10px; align-items: flex-start; background: var(--panel-2); border-radius: 10px; padding: 11px 12px; font-size: 12.5px; color: #C9D0D8; }
.info::before { content: "i"; flex: 0 0 18px; height: 18px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 11px; font-weight: 800; font-style: italic; }
.ctarow { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 8px; }
.trash { height: 46px; border-radius: 10px; border: 0; background: var(--chip); display: grid; place-items: center; }
.trash:hover:not(:disabled) { background: var(--chip-2); }
.trash:disabled { opacity: .4; cursor: not-allowed; }
.cta { height: 46px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; font-weight: 800; font-size: 14px; }
.cta:hover:not(:disabled) { background: var(--accent-2); }
.cta:disabled { background: var(--chip-2); color: var(--muted); cursor: default; }
.cta.ok:disabled { color: var(--good); }
.cta.err:disabled { color: var(--bad); }
.series-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line); gap: 10px; }
.series-row b { font-size: 30px; font-weight: 800; line-height: 1; }
.series-row span { display: flex; align-items: center; gap: 8px; font-weight: 700; min-width: 0; }

/* Forms and notices */
.card { background: var(--panel); border-radius: 16px; }
.eyebrow { font-size: 12px; color: var(--muted); font-weight: 600; }
.hint { font-size: 12px; color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.notice { padding: 28px 24px; display: grid; gap: 10px; }
.notice h2 { font-size: 26px; }
.form { padding: 24px; display: grid; gap: 16px; }
.form h2, .invite h2 { font-size: 26px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; border: 0; margin: 0; padding: 0; min-width: 0; }
.field label, .field legend { font-size: 12px; color: var(--muted); font-weight: 600; padding: 0; }
.field input[type=text], .field select { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); }
.radio { display: flex; gap: 8px; align-items: center; }
.invite { padding: 22px; display: grid; gap: 16px; border: 1px solid var(--accent-soft); }
.invite-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.invite-head > div { display: grid; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 8px; background: var(--chip); border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.steps li { counter-increment: s; background: var(--panel-2); border-radius: 12px; padding: 14px 16px; color: var(--muted); display: grid; gap: 6px; font-size: 13px; }
.steps li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 12px; }
.steps b { color: var(--ink); }
.linkbox { display: flex; gap: 8px; flex-wrap: wrap; }
.linkbox input { flex: 1 1 260px; min-width: 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); }
.champ { border: 1px solid rgba(227,239,91,.35); }
.champ h1 { font-size: 34px; }

#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--pill); color: var(--pill-ink); padding: 11px 18px; border-radius: 10px; font-weight: 700; opacity: 0; pointer-events: none; transition: .2s ease; max-width: calc(100% - 32px); z-index: 20; }
#toast.show { opacity: 1; transform: translateX(-50%); }

@media (max-width: 1180px) {
  .app { grid-template-columns: minmax(0, 1fr) 340px; }
  .side { grid-column: 1 / -1; position: static; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .side-label, .side-status, .side-note, .side .pos-group { display: none; }
  .nav-item { width: auto; flex: 0 0 auto; grid-template-columns: 22px auto auto; background: var(--panel); }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .slip { position: static; order: 2; }
  main { order: 3; }
  .topbar { position: static; gap: 14px; }
  .top-right { margin-left: 0; }
  .tabs .search { margin-left: 0; width: 100%; }
  .tabs input { flex: 1; width: auto; }
}
@media (max-width: 520px) {
  .runner { grid-template-columns: 32px minmax(0, 1fr); padding: 14px 16px; }
  .r-act { grid-column: 1 / -1; grid-template-columns: auto 1fr; align-items: center; justify-items: start; }
  .r-act .r-trail { justify-self: end; }
  .odds { min-width: 96px; height: 42px; }
  .hide-sm { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* Ranked mode */
:root { --t0: #C8875A; --t1: #B9C3CE; --t2: #E8B931; --t3: #5CCFD0; --t4: #8FB8FF; --t5: #E3EF5B; }
.navlink.on { color: var(--ink); border-bottom-color: var(--accent); }
.tier { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; border: 1px solid currentColor; white-space: nowrap; }
.tier::before { content: ""; width: 7px; height: 7px; transform: rotate(45deg); background: currentColor; }
.tier.t0 { color: var(--t0); } .tier.t1 { color: var(--t1); } .tier.t2 { color: var(--t2); } .tier.t3 { color: var(--t3); } .tier.t4 { color: var(--t4); } .tier.t5 { color: var(--t5); }
.rank-card { background: var(--panel); border-radius: 14px; padding: 16px; display: grid; gap: 8px; margin-bottom: 6px; }
.rank-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.rank-rp { font-size: 13px; color: var(--muted); }
.rank-rp b { font-size: 30px; font-weight: 800; color: var(--ink); letter-spacing: -.02em; margin-right: 4px; }
.rank-sub { font-size: 12px; color: var(--muted); }
.rank-skip { font-size: 12px; font-weight: 700; color: var(--bad); }
.rank-stats { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.rank-stats b { color: var(--ink); }
.linkbtn { border: 0; background: transparent; color: var(--accent-2); font-size: 12px; font-weight: 700; padding: 2px 0; }
.linkbtn:hover { text-decoration: underline; }
.field-err { color: var(--bad); font-size: 13px; min-height: 1em; margin: -6px 0 0; }
.you { font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; background: var(--accent); color: #fff; margin-left: 8px; vertical-align: 1px; }

<script>
/* ---------- Game rules (keep in step with sync/game.mjs) ---------- */
const SLOTS = ['G', 'G', 'F', 'F', 'C', 'UTIL'];
const SLOT_HINT = { G: 'Pick a guard', F: 'Pick a forward', C: 'Pick a center', UTIL: 'Any position' };
const CAP = 16;          // star budget for six players
const CAPTAIN_X = 1.5;   // the captain scores 1.5×…
const CAPTAIN_EXTRA = 1; // …and costs one extra star
const MAX_FIVE = 1;      // at most one 5★ player per lineup
const TIERS = ['Bronze', 'Silver', 'Gold', 'Platinum', 'Diamond', 'Elite'];
const RP_BY_FINISH = [30, 20, 20, 5, 5, -5, -5, -15, -15, -15];
const BONUS_STAR = 1; // extra budget a Bonus Star gives for one night
const SKIP_PENALTY = 3; // RP lost for skipping a game night; never drops a player out of their tier
const LIVE_DONE = new Set(['STATUS_FINAL', 'STATUS_POSTPONED', 'STATUS_CANCELED', 'STATUS_FORFEIT']);
// Box score line from the sync job: [min, pts, reb, ast, stl, blk, to]
const fpOf = l => l[1] + 1.2 * l[2] + 1.5 * l[3] + 3 * l[4] + 3 * l[5] - l[6];
const tierOf = rp => Math.min(TIERS.length - 1, Math.floor(Math.max(0, rp || 0) / 100));
const fmt = n => Math.round(n).toLocaleString('en-US');
const f1 = n => (Math.round(n * 10) / 10).toFixed(1);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);
const dateOf = id => new Date(+id.slice(0, 4), +id.slice(4, 6) - 1, +id.slice(6, 8));
const dayLabel = id => dateOf(id).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
const timeLabel = iso => new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
const isOut = p => /out|suspend/i.test(p.status || '');
const isGtd = p => /day-to-day|questionable|doubtful/i.test(p.status || '');
const ordinal = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th');
const elig = (slot, p) => slot === 'UTIL' || p.pos === slot;

let db = null, auth = null, me = { id: null, email: '' };
let profile = null, days = new Map(), entries = new Map(), group = null, leaders = [];
const loaded = { auth: false, profile: false, days: false };
const ui = { view: 'night', sel: null, pos: 'ALL', q: '', sort: 'stars', limit: 80, draft: null, draftCap: null, draftFor: null, save: '', sig: '', auth: '', authEmail: '', open: null, editName: false };

// Entry streak rewards (mirrors rewardFor in sync/game.mjs). Rewards can stack on one night.
function rewardFor(streak) {
  const r = { rp: 0, star: 0, saver: 0, badge: false };
  if (streak === 3) r.rp = 3;
  if (streak === 5) r.rp = 5;
  if (streak % 7 === 0) r.star = 1;
  if (streak % 14 === 0) r.saver = 1;
  if (streak === 30) r.badge = true;
  return r.rp || r.star || r.saver || r.badge ? r : null;
}
const rewardText = r => [r.rp && `+${r.rp} RP`, r.star && 'a Bonus Star', r.saver && 'a Streak Saver', r.badge && 'the streak badge'].filter(Boolean).join(' + ');
const budget = () => CAP + ((profile?.bonusStars || 0) > 0 ? BONUS_STAR : 0);

/* ---------- Pictures and badges ---------- */
const AVATAR_RE = /^data:image\/(jpeg|webp);base64,[A-Za-z0-9+/=]+$/;
const AVATAR_PX = 128, AVATAR_MAX = 30000;
// Pictures are checked here as well as in the rules, so only inline images ever reach the page.
const avatarHtml = (u, cls = '') => AVATAR_RE.test(u?.avatar || '')
  ? `<img class="ava ${cls}" src="${u.avatar}" alt="">`
  : `<span class="ava ${cls}" aria-hidden="true">${esc((u?.name || '?')[0].toUpperCase())}</span>`;

// Earned from sync-written stats, so a player can't award themselves a badge.
const bestTierOf = u => Math.max(u?.bestTier || 0, tierOf(u?.rp));
const BADGES = [
  { id: 'first', icon: '🏀', name: 'First Tip-Off', how: 'Finish your first night', on: u => (u.nights || 0) >= 1 },
  { id: 'nights10', icon: '🎟️', name: 'Regular', how: 'Play 10 nights', on: u => (u.nights || 0) >= 10 },
  { id: 'nights50', icon: '🎖️', name: 'Veteran', how: 'Play 50 nights', on: u => (u.nights || 0) >= 50 },
  { id: 'win1', icon: '🥇', name: 'Group Winner', how: 'Finish 1st in a group', on: u => (u.wins || 0) >= 1 },
  { id: 'win10', icon: '🏆', name: 'Champion', how: 'Win 10 groups', on: u => (u.wins || 0) >= 10 },
  { id: 'score300', icon: '🎯', name: 'Big Night', how: 'Score 300+ in a night', on: u => (u.bestScore || 0) >= 300 },

const poolCache = new WeakMap();
function pmap(day) {
  let m = poolCache.get(day);
  if (!m) { m = new Map(day.players.map(p => [p.id, p])); poolCache.set(day, m); }
  return m;
}

  const m = pmap(day);
  return ids.reduce((s, id) => s + (id ? m.get(id)?.stars || 0 : 0), 0) + (captain && ids.includes(captain) ? CAPTAIN_EXTRA : 0);
}
const fiveStars = (ids, day) => ids.filter(id => id && pmap(day).get(id)?.stars === 5).length;
const starsHtml = n => `<span class="stars" aria-label="${n} star${n > 1 ? 's' : ''}">${'★'.repeat(n)}<i>${'★'.repeat(5 - n)}</i></span>`;
function scoreRows(ids, captain, day) {
  const m = pmap(day);
  return ids.map((id, i) => {
    const p = m.get(id) || { id, name: 'Unknown player', team: '', pos: '', stars: 0 };
    const line = day.results?.[id];
    const base = line ? fpOf(line) : 0, cap = id === captain;
    return { slot: SLOTS[i], p, line, base, cap, fp: cap ? base * CAPTAIN_X : base };
  });
}
const total = rows => Math.round(rows.reduce((a, r) => a + r.fp, 0) * 10) / 10;

// Random legal lineups, then greedy upgrades, keeping the best. Mirrors buildLineup in sync/game.mjs.
function buildLineup(players, { base = SLOTS.map(() => null), captain = null, rnd = Math.random, noise = 0, tries = 120, cap: limit = CAP } = {}) {
  const m = new Map(players.map(p => [p.id, p]));
  const pl = players.filter(p => p.gp > 0 && !isOut(p));
  if (!pl.length) return null;
  const lc = (lu, c) => lu.reduce((s, id) => s + (id ? m.get(id).stars : 0), 0) + (c && lu.includes(c) ? CAPTAIN_EXTRA : 0);
  const fives = lu => lu.filter(id => id && m.get(id).stars === 5).length;
  const randn = () => Math.sqrt(-2 * Math.log(rnd() || 1e-9)) * Math.cos(2 * Math.PI * rnd());
  const val = new Map(pl.map(p => [p.id, p.avg * (1 + noise * randn())]));
  const v = id => val.get(id) ?? m.get(id)?.avg ?? 0;
  const free = SLOTS.map((_, i) => i).filter(i => !base[i]);
  const fixedCap = captain && base.includes(captain) ? captain : null;
  const pickCaptain = lu => fixedCap || (lc(lu, null) + CAPTAIN_EXTRA <= limit ? lu.slice().sort((x, y) => v(y) - v(x))[0] : null);
  const legal = (lu, c) => lc(lu, c) <= limit && fives(lu) <= MAX_FIVE;
  const score = (lu, c) => lu.reduce((s, id) => s + v(id), 0) + (c ? v(c) * (CAPTAIN_X - 1) : 0);
  let best = null, bestV = -Infinity;
  for (let t = 0; t < tries; t++) {
    const lu = base.slice();
    let ok = true;
    const order = free.slice().sort(() => rnd() - .5).sort((x, y) => (x === 5) - (y === 5));
    for (let k = 0; k < order.length; k++) {
      const i = order[k], room = limit - lc(lu, fixedCap) - (order.length - k - 1), fiveOk = fives(lu) < MAX_FIVE;
      const c = pl.filter(p => elig(SLOTS[i], p) && !lu.includes(p.id) && p.stars <= room && (fiveOk || p.stars < 5));
      if (!c.length) { ok = false; break; }
      lu[i] = c[Math.floor(rnd() * c.length)].id;
    }
    if (!ok) continue;
    let cap = pickCaptain(lu), cur = score(lu, cap);
    for (let pass = 0; pass < 3; pass++) {
      let improved = false;
      for (const i of free) {
        const was = lu[i];
        for (const p of pl) {
          if (!elig(SLOTS[i], p) || lu.includes(p.id)) continue;
          lu[i] = p.id;
          const c2 = pickCaptain(lu);
          if (legal(lu, c2) && score(lu, c2) > cur + 1e-9) { cur = score(lu, c2); cap = c2; improved = true; break; }
          lu[i] = was;
        }
      }
      if (!improved) break;
    }
    if (legal(lu, cap) && cur > bestV) { bestV = cur; best = { ids: lu.slice(), captain: cap }; }
  }
  return best;
}

}

function streakBanner() {
  const scored = profile.streak || 0;
  const open = nextOpenDate();
  const inTonight = !!(open && entries.has(open));
  // Entered nights the sync hasn't scored yet count toward the streak you're on.
  const pending = [...entries.values()].filter(e => !e.finish && !e.invalid && days.has(e.date)).length;
  const streak = scored + pending;
  let next = streak + 1;
  while (!rewardFor(next)) next++;
  const away = next - streak, reward = rewardText(rewardFor(next));
  const lost = !streak && profile.lastStreak;
  const title = streak ? `🔥 ${streak}-night streak` : lost ? `Your ${profile.lastStreak}-night streak ended` : 'Start a streak';
  const night = open ? dayLabel(open).split(',')[0] : '';
  const line = !open ? `Next reward at ${next} nights: ${reward}. Enter the next slate when it’s posted.`
    : inTonight ? `You’re in for ${night}.${rewardFor(streak) ? ` That earns you ${rewardText(rewardFor(streak))} when the night is scored.` : ''} Next reward at ${next} nights: ${reward}.`
    : away === 1 ? `Enter ${night} to earn ${reward}.`
    : `Enter ${night} to ${streak ? `reach ${streak + 1} nights` : 'start your streak'}. ${away} nights to ${reward}.`;
  const last = profile.lastReward;
  const earned = last && last.date === profile.lastNight ? `<span class="st-chip won">Earned ${dayLabel(last.date).split(',')[0]}: ${rewardText(last)}</span>` : '';
  const momentNames = profile.lastMoments && profile.lastMoments.date === profile.lastNight ? (profile.lastMoments.ids || []).map(id => MOMENTS.find(m => m.id === id)).filter(Boolean) : [];
  const moments = momentNames.map(m => `<span class="st-chip won">New badge: ${m.icon} ${esc(m.name)}</span>`).join('');
  const stars = profile.bonusStars ? `<span class="st-chip tag">★ Bonus Star ready: ${budget()}★ budget</span>` : '';
  const savers = profile.savers ? `<span class="st-chip">Streak Saver × ${profile.savers}</span>` : '';
  // The last reward reached, the next few, and the 30-night badge while it's still ahead.
  const stops = [];
  for (let n = 1; stops.filter(x => x > streak).length < 3; n++) if (rewardFor(n)) stops.push(n);
  const passed = stops.filter(x => x <= streak).pop();
  const shown = [...stops.filter(x => x > streak), ...(passed ? [passed] : []), ...(streak < 30 ? [30] : [])];
  const ladderStops = [...new Set(shown)].sort((a, b) => a - b);
  const ladder = ladderStops.map(n => `<li class="${streak >= n ? 'done' : n === next ? 'next' : ''}"><b>${n}</b><span>${rewardText(rewardFor(n)).replace(/^a /, '').replace(' + a ', ' + ').replace('the streak badge', 'Badge')}</span></li>`).join('');
  return `<div class="st-top"><div><div class="st-title">${title}</div><p class="st-line">${line}</p></div>
      <div class="st-chips">${earned}${moments}${stars}${savers}</div></div>
    <ol class="st-ladder" aria-label="Streak rewards">${ladder}</ol>`;
}

}

function slateCard(day) {

  const races = day.games.map(x => {

    return `<div class="race ${done ? 'done' : started ? 'in' : ''}"><b>${started ? `${x.awayScore}–${x.homeScore}` : timeLabel(x.tip)}</b><span>${esc(x.away)} @ ${esc(x.home)}</span>${started ? `<small>${esc(x.detail)}</small>` : ''}</div>`;
  }).join('');
  return `<div class="lockline"><span class="lock ${locked(day) ? 'locked' : ''}">${lockTxt}</span></div><div class="races" data-day="${day.date}">${races}<i class="sx" aria-hidden="true"></i></div>`;

// Redraws keep the schedule where the player scrolled it, on the same night.
function keepRacesScroll(redraw) {
  const old = $('.races'), day = old?.dataset.day, x = old?.scrollLeft || 0;

}

/* ---------- Group results ---------- */
function groupRows(day) {
  const res = new Map((group.results || []).map(r => [r.key, r]));
  const rows = group.members.map(mb => {
    const rows = scoreRows(mb.ids, mb.captain, day);
    return { ...mb, rows, total: total(rows), best: Math.max(0, ...rows.map(r => r.fp)), res: res.get(mb.key) };
  });
  if (group.scored) rows.sort((a, b) => (a.res?.finish || 99) - (b.res?.finish || 99));
  else rows.sort((a, b) => b.total - a.total || b.best - a.best || (a.at ?? Infinity) - (b.at ?? Infinity));
  return rows;
}

// Where a player's night stands, from his game's status: live, final, did not play, game off or upcoming.
function playerState(r, day) {
  const g = day.games.find(x => x.away === r.p.team || x.home === r.p.team);
  if (!g) return { kind: 'final', text: 'No game' };
  if (g.status === 'STATUS_SCHEDULED') return { kind: 'soon', text: `Starts ${timeLabel(g.tip)}` };
  if (LIVE_DONE.has(g.status)) {
    if (g.status !== 'STATUS_FINAL') return { kind: 'off', text: 'Game off' };
    return r.line ? { kind: 'final', text: 'Final' } : { kind: 'off', text: 'Did not play' };
  }
  return { kind: 'live', text: r.line ? `Live · ${g.detail}` : `Live · hasn’t played yet` };
}

function lineupProgress(rows, day) {
  const n = { live: 0, final: 0, soon: 0, off: 0 };
  rows.forEach(r => n[playerState(r, day).kind]++);
  if (n.live + n.soon === 0) return 'All players finished';
  return [n.live && `${n.live} live`,n.final + n.off && `${n.final + n.off} finished`, n.soon && `${n.soon} to come`].filter(Boolean).join(' · ');
}

function lineupDetail(mb, day) {
  return mb.rows.map(r => {
    const l = r.line, st = playerState(r, day);
    const stat = l ? `<span class="sep">|</span>${l[1]} PTS · ${l[2]} REB · ${l[3]} AST · ${l[4]} STL · ${l[5]} BLK · ${l[6]} TO · ${l[0]} MIN` : '';
    return `<div class="runner sub" data-pid="${esc(r.p.id)}">${face(r.p)}
      <div><div class="r-name"><span class="ptag">${r.slot}</span>${plink(r.p)}${r.cap ? '<span class="ctag">★ Captain</span>' : ''}<span class="pstate ${st.kind}">${esc(st.text)}</span></div><div class="r-sub">${esc(r.p.team)} ${esc(r.p.opp)}${stat}</div></div>
      <div class="r-act"><span class="sc ${l ? '' : 'zero'} ${r.cap ? 'capsc' : ''}">${l ? f1(r.fp) : '—'}</span><span class="r-trail">${r.cap && l ? `${f1(r.base)} × 1.5` : starsHtml(r.p.stars)}</span></div></div>`;
  }).join('');
}

// Center-crops to a small square. Redrawing also drops photo metadata such as location.
async function uploadAvatar(file) {
  if (!file.type.startsWith('image/') || file.type === 'image/svg+xml') return toast('Choose a JPG, PNG or WebP image.');
  if (file.size > 15 * 1024 * 1024) return toast('That image is over 15 MB. Choose a smaller one.');
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch (err) { return toast('That image couldn’t be read. Try a JPG or PNG.'); }
  const c = document.createElement('canvas');
  c.width = c.height = AVATAR_PX;
  const side = Math.min(bmp.width, bmp.height);
  const g = c.getContext('2d');
  g.fillStyle = '#161A20';
  g.fillRect(0, 0, AVATAR_PX, AVATAR_PX);
  g.drawImage(bmp, (bmp.width - side) / 2, (bmp.height - side) / 2, side, side, 0, 0, AVATAR_PX, AVATAR_PX);
  bmp.close?.();
  let url = '';
  for (const q of [0.82, 0.7, 0.55, 0.4]) { url = c.toDataURL('image/jpeg', q); if (url.length <= AVATAR_MAX) break; }
  if (url.length > AVATAR_MAX || !AVATAR_RE.test(url)) return toast('That image couldn’t be shrunk enough. Try a different one.');
  saveProfile({ avatar: url }, 'Picture updated.');
}

  if (ui.view === 'night' && e) {
    night = e.finish
      ? `<div class="series-row"><span>Finish</span><b>${ordinal(e.finish)}</b></div><div class="series-row"><span>Score</span><b>${f1(e.score)}</b></div><div class="series-row"><span>Rank points</span><b class="${e.rpDelta >= 0 ? 'up' : 'down'}">${e.rpDelta >= 0 ? '+' : ''}${e.rpDelta}</b></div>`
      : `<div class="series-row"><span>Status</span><b class="small">${e.invalid ? 'Invalid' : e.group ? 'Live' : 'Locked'}</b></div>`;
  }
  return `<div class="slip-card">
    <div class="slip-head"><span class="count">${tier + 1}</span><h3>${TIERS[tier]}</h3></div>
    ${night}
    <div class="series-row"><span>Rank points</span><b>${fmt(rp)}</b></div>
    <div class="slip-foot"><div class="info">${tier === TIERS.length - 1 ? 'You’re in the top tier.' : `${100 - (rp - tier * 100)} more RP to reach ${TIERS[tier + 1]}.`} Finish top 3 in your group to climb fastest.</div></div>
  </div>`;
}

/* ---------- Render ---------- */
function nextOpenDate() {
  return [...days.values()].sort((a, b) => a.date < b.date ? -1 : 1).find(d => !locked(d))?.date || null;
}

// Scroll cues: a row that has more to swipe to shows a fade and chevron at its edge.
function updateScrollCues() {
  document.querySelectorAll('.races, #side, .tablewrap').forEach(el => el.classList.toggle('more-r', el.scrollWidth - el.clientWidth - el.scrollLeft > 4));
}
let afterRenderQueued = false;
function afterRender() {
  afterRenderQueued = false;
  const docked = !!$('#dock');
  document.body.classList.toggle('has-dock', docked);
  if (!docked) document.body.classList.remove('sheet-open');
  updateScrollCues();
}

function render() {
  if (!afterRenderQueued) { afterRenderQueued = true; setTimeout(afterRender, 0); }
  if (!loaded.auth) return;
  renderTop();
  renderPodium();
  if (!me.id) {
    $('#side').innerHTML = ''; $('#slip').innerHTML = '';
    const sig = 'signin|' + ui.auth;
    if (sig !== ui.sig) { ui.sig = sig; $('#main').innerHTML = signinView(); }
    return;
  }
  if (!loaded.profile) return;
  if (!profile?.name || ui.editName) {
    $('#side').innerHTML = profile?.name ? '' : ''; $('#slip').innerHTML = '';
    if (ui.sig !== 'name') { ui.sig = 'name'; $('#main').innerHTML = nameView(); }
    return;
  }
  if (!loaded.days) return;
  if (!ui.sel || !days.has(ui.sel)) {
    const sorted = [...days.keys()].sort();
    ui.sel = (days.has(etDay()) ? etDay() : nextOpenDate()) || sorted.filter(d => entries.has(d)).pop() || sorted.pop() || null;
  }
  watchGroup();
  if (ui.view === 'night' && liveSel !== ui.sel) { liveSel = ui.sel; pollLive(); }
  renderSide();
  const m = $('#main');
  if (ui.view === 'leaders') { ui.sig = 'leaders'; m.innerHTML = leadersView(); $('#slip').innerHTML = slipSummary(); return; }
  if (ui.view === 'profile') { ui.sig = 'profile'; m.innerHTML = profileView(); $('#slip').innerHTML = slipSummary(); return; }
  if (ui.view === 'history') { ui.sig = 'history'; m.innerHTML = historyView(); $('#slip').innerHTML = slipSummary(); return; }
  const day = days.get(ui.sel);
  if (!day) { ui.sig = 'noslate'; m.innerHTML = notice('Tonight', 'Waiting for the next slate', '<p>The next NBA game day hasn’t been posted yet. The sync posts slates a day ahead.</p>'); $('#slip').innerHTML = slipSummary(); return; }
  const e = entries.get(ui.sel);
  if (!locked(day)) {
    const sig = 'build|' + ui.sel;
    if (ui.draftFor !== ui.sel) { ui.draft = (e?.ids || SLOTS.map(() => null)).slice(); ui.draftCap = e?.captain ?? null; ui.draftFor = ui.sel; ui.save = ''; }
    if (sig === ui.sig && $('#poolrows')) { renderPool(); renderLineup(); const el = $('#slate'); if (el) keepRacesScroll(() => { el.innerHTML = slateCard(day); }); const st = $('#streak'); if (st) st.innerHTML = streakBanner(); return; }
    ui.sig = sig;
    $('#slip').innerHTML = '<button class="dock" id="dock" data-action="sheet" aria-expanded="false" aria-label="Show your lineup"></button><div class="sheet-bg" data-action="sheet-close"></div><div class="slip-card" id="lineup"></div>';
    m.innerHTML = `<section class="streak" id="streak">${streakBanner()}</section>${heroCard(day)}<section class="panel"><div class="list-head"><div><h2>${dayLabel(ui.sel)} player pool</h2><p class="sub">Tap a rating to add a player. Fit six within ${budget()}★, with one 5★ at most. The captain costs +1★.</p></div></div><div class="pool-tools">${poolTools()}</div><div id="poolrows"></div><div id="poolmore"></div></section>${legend}`;
    renderPool(); renderLineup();
    return;
  }
  ui.sig = 'night|' + ui.sel;
  $('#slip').innerHTML = slipSummary();
  let body;
  const next = nextOpenDate();
  const nextBtn = next ? `<div class="row"><button class="btn primary" data-action="sel" data-d="${next}">Enter ${dayLabel(next)}</button></div>` : '';
  if (!e) body = notice('Not entered', 'You sat this night out', `<p>${profile.nights ? `${profile.lastSaved === ui.sel ? 'Your Streak Saver covered this night, so your streak and RP are safe.' : `Skipping a game night costs ${SKIP_PENALTY} RP and your streak, but it can’t drop you out of your tier.`}` : 'Enter a night to get on the board.'}</p>${nextBtn}`);
  else if (e.invalid) body = notice('Entry not counted', 'This lineup was invalid', `<p>The lineup was rejected (${esc(e.invalid)}), so it wasn’t placed in a group. Nothing changed on your rank.</p>${nextBtn}`);
  else if (!e.group || !group || group.date !== ui.sel) body = notice('Locked in', 'Forming groups', `<p>Lineups locked at ${timeLabel(day.lockAt)}. Groups of 10 are formed on the next sync, within 30 minutes of tip-off.</p>`);
  else body = groupView(day);
  keepRacesScroll(() => { m.innerHTML = `<section class="streak" id="streak">${streakBanner()}</section>${heroCard(day)}${body}${legend}`; });

/* ---------- Edits ---------- */
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

let saveTimer = null, saving = false, saveAgain = false;
function changed() {
  ui.save = 'pending'; renderPool(); renderLineup(); renderSide();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 700);
}
// An entry exists only while the lineup is complete; emptying a slot withdraws it.
async function flush() {
  if (saving) { saveAgain = true; return; }
  const date = ui.draftFor, day = days.get(date), ids = ui.draft.slice(), captain = ids.includes(ui.draftCap) ? ui.draftCap : null;
  if (!day || locked(day)) { ui.save = 'err'; toast('Lineups are locked for this slate.'); render(); return; }
  saving = true;
  const ref = db.doc(`entries/${date}_${me.id}`);
  try {
    if (complete(ids)) await ref.set({ uid: me.id, date, ids, captain, at: Date.now() });
    else if (entries.has(date)) await ref.delete();
    ui.save = 'ok';
  } catch (err) { ui.save = 'err'; }
  saving = false;
  if (saveAgain) { saveAgain = false; return flush(); }
  if (ui.draftFor === date && $('#lineup')) renderLineup();
}

function addPlayer(id) {
  const day = days.get(ui.sel), lu = ui.draft, p = pmap(day).get(id);
  if (!p || lu.includes(id)) return;
  let i = SLOTS.findIndex((s, k) => s === p.pos && !lu[k]);
  if (i < 0 && !lu[5]) i = 5;
  if (i < 0) return toast(`Your ${p.pos} slots and UTIL are full. Remove someone first.`);
  if (p.stars === 5 && fiveStars(lu, day) >= MAX_FIVE) return toast('You can only have one 5★ player. Remove your other 5★ first.');
  const over = cost(lu, ui.draftCap, day) + p.stars - budget();
  if (over > 0) return toast(`${p.name} is ${p.stars}★. You’d be ${over}★ over your ${budget()}★ budget.`);
  if (isOut(p)) toast(`${p.name} is listed as out. Out players score 0.`);
  lu[i] = id; changed();
}

function setCaptain(id) {
  const day = days.get(ui.sel);
  if (ui.draftCap === id) { ui.draftCap = null; return changed(); }
  const over = cost(ui.draft, id, day) - budget();
  if (over > 0) return toast(`A captain costs one extra star, and you have no stars left. Swap someone for a cheaper player first.`);
  ui.draftCap = id; changed();
}

const EMAIL_KEY = 'bo7-signin-email';
let unsubGroup = null, groupKey = '', unsubLeaders = null;

// US Eastern calendar date, offset by whole days, as YYYYMMDD (NBA game days are Eastern dates).
function etDay(offset = 0) {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' })
    .format(new Date(Date.now() + offset * 864e5)).replace(/-/g, '');
}

function fail(err) {
  const denied = err && err.code === 'permission-denied';
  $('#main').innerHTML = notice('Error', denied ? 'The database refused the request' : 'Couldn’t load the game', denied
    ? '<p>Check that the Firestore security rules from <b>firestore.rules</b> are published in the Firebase console.</p>'
    : '<p>Reload the page to try again.</p>');
}

function watchGroup() {
  const e = entries.get(ui.sel), key = e?.group ? `${ui.sel}/${e.group}` : '';
  if (key === groupKey) return;
  groupKey = key; unsubGroup?.(); group = null;
  if (!key) return;
  unsubGroup = db.doc(`days/${ui.sel}/groups/${e.group}`).onSnapshot(s => { group = s.exists ? s.data() : null; ui.sig = ''; render(); }, () => {});
}

function watchLeaders() {
  if (unsubLeaders) return;
  unsubLeaders = db.collection('users').orderBy('rp', 'desc').limit(50)
    .onSnapshot(s => { leaders = s.docs.map(d => ({ id: d.id, ...d.data() })); if (ui.view === 'leaders') { ui.sig = ''; render(); } }, () => {});
}

/* ---------- Player profile ---------- */
const ESPN_ATHLETE = 'https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba/athletes';
const profiles = new Map();
let pcardFor = null;

function fetchProfile(id) {
  if (!profiles.has(id)) {
    const json = u => fetch(u).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
    profiles.set(id, Promise.all([json(`${ESPN_ATHLETE}/${id}`), json(`${ESPN_ATHLETE}/${id}/gamelog`)])
      .catch(err => { profiles.delete(id); throw err; }));
  }
  return profiles.get(id);
}

// The player's latest regular-season and playoff games, newest first.
function lastGames(log, n = 5) {
  const L = log.labels || [], rows = [];
  for (const st of log.seasonTypes || []) {
    if (/preseason/i.test(st.displayName || '')) continue;
    for (const c of st.categories || []) {
      for (const ev of c.events || []) {
        const info = log.events?.[ev.eventId];
        if (!info) continue;
        const num = k => parseFloat(ev.stats[L.indexOf(k)]) || 0;
        const line = [num('MIN'), num('PTS'), num('REB'), num('AST'), num('STL'), num('BLK'), num('TO')];
        rows.push({ date: info.gameDate, opp: `${info.atVs || ''} ${info.opponent?.abbreviation || ''}`.trim(), result: info.gameResult || '', score: info.score || '', line, fp: fpOf(line) });
      }
    }
  }
  return rows.sort((a, b) => Date.parse(b.date) - Date.parse(a.date)).slice(0, n);
}

function describe(a, p) {
  const pos = (a.position?.displayName || POS_NAME[p?.pos] || 'player').toLowerCase();
  const team = a.team?.displayName || p?.team;
  const lines = [`${a.displayName} is a ${a.age ? a.age + '-year-old ' : ''}${pos}${team ? ` for the ${team}` : ''}${a.displayExperience ? `, in his ${a.displayExperience.toLowerCase()}` : ''}.`];
  if (a.displayDraft) lines.push(`Drafted ${a.displayDraft}.`);
  if (a.displayBirthPlace) lines.push(`Born in ${a.displayBirthPlace}.`);
  return lines.join(' ');
}

function gamesTable(games) {
  if (!games.length) return '<p class="empty">No regular-season games yet this season.</p>';
  const cols = ['MIN', 'PTS', 'REB', 'AST', 'STL', 'BLK', 'TO'];
  const avg = i => f1(games.reduce((s, g) => s + g.line[i], 0) / games.length);
  return `<div class="tablewrap"><table class="pc-games">
    <thead><tr><th>Game</th><th>Result</th>${cols.map(c => `<th class="r">${c}</th>`).join('')}<th class="r">FP</th></tr></thead>
    <tbody>${games.map(g => `<tr><td><b>${new Date(g.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</b> <span class="pc-dim">${esc(g.opp)}</span></td>
      <td class="pc-res ${g.result === 'W' ? 'w' : g.result === 'L' ? 'l' : ''}">${esc(g.result)} <span class="pc-dim">${esc(g.score)}</span></td>
      ${g.line.map(v => `<td class="r num">${v}</td>`).join('')}<td class="r num"><b>${f1(g.fp)}</b></td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="2">Average</td>${cols.map((_, i) => `<td class="r num">${avg(i)}</td>`).join('')}<td class="r num">${f1(games.reduce((s, g) => s + g.fp, 0) / games.length)}</td></tr></tfoot>
  </table></div>`;
}

function renderPlayer(id, p, data, failed) {

  const a = data?.[0]?.athlete, name = a?.displayName || p?.name || 'Player';

  $('#pcard').innerHTML = `

    <div class="pc-head">
      <div class="pc-photo"><img src="https://a.espncdn.com/i/headshots/nba/players/full/${encodeURIComponent(id)}.png" alt="" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span hidden>${jersey(p?.team || '')}</span></div>
      <div class="pc-title"><h2 id="pc-name">${esc(name)}</h2><p class="pc-meta">${esc(meta)}</p>
        ${p ? `<div class="pc-tags">${starsHtml(p.stars)}${p.gp ? `<span class="chip">FPPG ${f1(p.avg)}</span>` : ''}${isOut(p) ? '<span class="inj out">Out</span>' : isGtd(p) ? `<span class="inj gtd">${esc(p.status)}</span>` : ''}${p.opp ? `<span class="chip">${esc(p.opp)}</span>` : ''}</div>` : ''}

/* ---------- Live scores ---------- */
// GitHub can run the scheduled sync hours late, so an open page reads game scores straight from ESPN.
// This only changes what's shown: official finishes and rank points still come from the sync.
const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba';
const live = new Map(), boxCache = new Map();
let rawDays = new Map(), liveBusy = false, liveSel = null;

// Mirrors boxLines in sync/nba-sync.mjs: { athleteId: [min, pts, reb, ast, stl, blk, to, threes] }
function boxLines(box) {
  const out = {};
  for (const t of box.boxscore?.players || []) {
    const st = t.statistics?.[0];
    if (!st) continue;
    const L = st.labels || st.names;
    for (const a of st.athletes || []) {
      if (a.didNotPlay || !a.stats || !a.stats.length) continue;
      const n = k => { const v = parseFloat(a.stats[L.indexOf(k)]); return isNaN(v) ? 0 : v; };
      out[a.athlete.id] = [n('MIN'), n('PTS'), n('REB'), n('AST'), n('STL'), n('BLK'), n('TO'), n('3PT')];
    }
  }
  return out;
}

function withLive(doc) {
  const l = live.get(doc.date);
  return !l || doc.final ? doc : { ...doc, games: l.games, results: { ...doc.results, ...l.results }, final: l.final, updatedAt: l.at };
}
const applyLive = () => { days = new Map([...rawDays].map(([k, d]) => [k, withLive(d)])); };

async function pollLive() {
  const doc = rawDays.get(ui.sel);
  if (liveBusy || document.hidden || ui.view !== 'night' || !doc || doc.final || !locked(doc)) return;
  liveBusy = true;
  try {
    const sb = await (await fetch(`${ESPN}/scoreboard?dates=${doc.date}`)).json();
    const events = new Map(sb.events.map(e => [e.id, e]));
    const results = {};
    const games = await Promise.all(doc.games.map(async g => {
      const e = events.get(g.id);
      if (!e) return g;
      const c = e.competitions[0], status = e.status.type.name;
      const score = side => +c.competitors.find(x => x.homeAway === side).score || 0;
      if (status !== 'STATUS_SCHEDULED') {
        let lines = boxCache.get(g.id);
        if (!lines) {
          lines = boxLines(await (await fetch(`${ESPN}/summary?event=${g.id}`)).json());
          if (LIVE_DONE.has(status)) boxCache.set(g.id, lines);
        }
        Object.assign(results, lines);
      }
      return { ...g, status, detail: e.status.type.shortDetail, awayScore: score('away'), homeScore: score('home') };
    }));
    live.set(doc.date, { games, results, final: games.every(g => LIVE_DONE.has(g.status)), at: new Date().toISOString() });
    applyLive();
    render();
  } catch (e) { /* keep showing the last synced numbers */ } finally { liveBusy = false; }
}

function startData() {
  db.doc('users/' + me.id).onSnapshot(s => { profile = s.exists ? s.data() : null; loaded.profile = true; ui.sig = ''; render(); }, fail);
  db.collection('entries').where('uid', '==', me.id)
    .onSnapshot(s => { entries = new Map(s.docs.map(x => [x.data().date, x.data()])); render(); }, () => {});
}

async function finishSignIn(email) {
  try {
    await auth.signInWithEmailLink(email, location.href);
    try { localStorage.removeItem(EMAIL_KEY); } catch (e) {}
  } catch (e) {
    toast('That sign-in link has expired or was already used. Request a new one.');
  }
  ui.auth = '';
  history.replaceState({}, '', location.pathname);
}

async function boot() {
  const cfg = window.FIREBASE_CONFIG;
  if (!window.firebase || !cfg || !cfg.apiKey || /^PASTE/.test(cfg.apiKey)) {
    $('#main').innerHTML = notice('Setup needed', 'Add your Firebase config', '<p>Open <b>config.js</b> and paste your Firebase web app config. README.md walks through it.</p>');
    return;
  }
  firebase.initializeApp(cfg);
  auth = firebase.auth();
  db = firebase.firestore();
  db.collection('days').where(firebase.firestore.FieldPath.documentId(), '>=', etDay(-3)).limit(6)
    .onSnapshot(s => { rawDays = new Map(s.docs.map(x => [x.id, x.data()])); applyLive(); loaded.days = true; render(); }, fail);
  if (auth.isSignInWithEmailLink(location.href)) {
    let email = null;
    try { email = localStorage.getItem(EMAIL_KEY); } catch (e) {}
    if (email) await finishSignIn(email); else ui.auth = 'confirm';
  }
  auth.onAuthStateChanged(u => {
    if (!u && me.id) { location.reload(); return; }
    me = { id: u ? u.uid : null, email: u?.email || '' };
    loaded.auth = true;
    ui.sig = '';
    if (u) startData();
    render();
  });
  // Re-render each minute so countdowns tick and slates lock on time.
  setInterval(() => { if (ui.sig.startsWith('build|') && days.get(ui.sel) && locked(days.get(ui.sel))) ui.sig = ''; render(); pollLive(); }, 60000);
  document.addEventListener('visibilitychange', pollLive);
}
boot();
</script>
