/* ---------- Render ---------- */
function nextOpenDate() {
  return [...days.values()].sort((a, b) => a.date < b.date ? -1 : 1).find(d => !locked(d))?.date || null;
}

// Scroll cues: a row that has more to swipe to shows a fade and chevron at its edge.
function updateScrollCues() {
  document.querySelectorAll('.races, #side, .tablewrap').forEach(el => el.classList.toggle('more-r', el.scrollWidth - el.clientWidth - el.scrollLeft > 4));
}
let afterRenderQueued = false;
function afterRender() {
  afterRenderQueued = false;
  fitStarNames();
  const docked = !!$('#dock');
  document.body.classList.toggle('has-dock', docked);
  // On phones the court moves to the top of the page while a lineup is being set.
  document.body.classList.toggle('drafting', !!$('#court'));
  document.body.classList.toggle('on-matchup', ui.view === 'matchup');
  document.body.classList.toggle('no-slip', !$('#slip').innerHTML.trim());
  if (!docked) document.body.classList.remove('sheet-open');
  updateScrollCues();
}

function render() {
  if (!afterRenderQueued) { afterRenderQueued = true; setTimeout(afterRender, 0); }
  if (!loaded.auth) return;
  renderTop();
  if (!me.id) {
    $('#side').innerHTML = ''; $('#slip').innerHTML = '';
    const sig = 'signin|' + ui.auth;
    if (sig !== ui.sig) { ui.sig = sig; $('#main').innerHTML = signinView(); }
    return;
  }
  if (!loaded.profile) return;
  if (!profile?.name || ui.editName) {
    $('#side').innerHTML = profile?.name ? '' : ''; $('#slip').innerHTML = '';
    if (ui.sig !== 'name') { ui.sig = 'name'; $('#main').innerHTML = nameView(); }
    return;
  }
  // A night's draft starts from the saved entry, so wait for entries as well as days.
  if (!loaded.days || !loaded.entries || !loaded.cards) return;
  // New players open their starter packs before anything else.
  if ((profile.starterPacks || 0) < STARTER_PACKS || ui.reveal) {
    $('#side').innerHTML = ''; $('#slip').innerHTML = '';
    const sig = 'packs|' + (profile.starterPacks || 0) + '|' + ui.opening + '|' + (ui.reveal ? ui.revealNo : 0) + '|' + (ui.revealSt?.done ? 1 : 0);
    if (sig !== ui.sig) { ui.sig = sig; $('#main').innerHTML = packView(); }
    return;
  }
  if (!ui.sel || !days.has(ui.sel)) {
    const sorted = [...days.keys()].sort();
    ui.sel = (days.has(etDay()) ? etDay() : nextOpenDate()) || sorted.filter(d => entries.has(d)).pop() || sorted.pop() || null;
  }
  watchGroup();
  if ((ui.view === 'night' || ui.view === 'matchup') && liveSel !== ui.sel) { liveSel = ui.sel; pollLive(); }
  renderSide();
  const m = $('#main');
  if (ui.view === 'cards') { ui.sig = 'cards'; m.innerHTML = cardsView(); $('#slip').innerHTML = ''; return; }
  if (ui.view === 'packs') {
    // While the stack is out, later updates (the new cards and coins arriving) mustn't redraw it mid-flip.
    const stacking = !!(ui.packReveal?.st && !ui.packReveal.st.done);
    if (stacking && ui.sig === 'packs-stack' && $('#stk')) return;
    ui.sig = stacking ? 'packs-stack' : 'packs'; m.innerHTML = packsView(); $('#slip').innerHTML = ''; return;
  }
  if (ui.view === 'matchup') { ui.sig = 'matchup'; m.innerHTML = matchupView(); $('#slip').innerHTML = ''; return; }
  if (ui.view === 'leaders') { ui.sig = 'leaders'; m.innerHTML = leadersView(); $('#slip').innerHTML = ''; return; }
  if (ui.view === 'profile') { ui.sig = 'profile'; m.innerHTML = profileView(); $('#slip').innerHTML = ''; return; }
  if (ui.view === 'history') { ui.sig = 'history'; m.innerHTML = historyView(); $('#slip').innerHTML = ''; return; }
  const day = days.get(ui.sel);
  if (!day) { ui.sig = 'noslate'; m.innerHTML = notice('Tonight', 'Waiting for the next slate', '<p>The next NBA game day hasn’t been posted yet. The sync posts slates a day ahead.</p>'); $('#slip').innerHTML = ''; return; }
  const e = entries.get(ui.sel);
  if (!locked(day)) {
    const sig = 'build|' + ui.sel;
    if (ui.draftFor !== ui.sel) { ui.draft = (e?.ids || SLOTS.map(() => null)).slice(); ui.draftBoosts = { ...(e?.boosts || {}) }; ui.draftFor = ui.sel; ui.save = ''; }
    if (sig === ui.sig && $('#court')) { renderCourt(); renderLineup(); const wk = $('#week'); if (wk) wk.innerHTML = weekPanel(); const el = $('#slate'); if (el) keepRacesScroll(() => { el.innerHTML = slateCard(day); }); const st = $('#streak'); if (st) st.innerHTML = streakBanner(); return; }
    ui.sig = sig;
    $('#slip').innerHTML = '<button class="dock" id="dock" data-action="sheet" aria-expanded="false" aria-label="Show your lineup"></button><div class="sheet-bg" data-action="sheet-close"></div><div class="slip-card" id="lineup"></div>';
    // The court leads the page, squad-screen style; the week, the night's games and the streak follow it.
    m.innerHTML = `<section class="court-panel lineup-stage" aria-labelledby="lineup-h"><div id="court"></div></section><div id="week">${weekPanel()}</div>${heroCard(day)}<section class="streak" id="streak">${streakBanner()}</section>`;
    renderCourt(); renderLineup();
    return;
  }
  ui.sig = 'night|' + ui.sel;
  $('#slip').innerHTML = '';
  let body;
  const next = nextOpenDate();
  const nextBtn = next ? `<div class="row"><button class="btn primary" data-action="sel" data-d="${next}">Enter ${dayLabel(next)}</button></div>` : '';
  const wm = weekMatch(weekOf(ui.sel));
  const sat = notice('Not entered', 'You sat this night out', `<p>${profile.nights ? `${profile.lastSaved === ui.sel ? 'Your Streak Saver covered this night, so your streak and RP are safe.' : `Skipping a game night adds nothing to your week and costs ${SKIP_PENALTY} RP and your streak, but it can’t drop you out of your tier.`}` : 'Enter a night to get on the board.'}</p>${nextBtn}`);
  if (e?.group && group && group.date === ui.sel) body = groupView(day);
  else if (e?.invalid) body = notice('Entry not counted', 'This lineup was invalid', `<p>The lineup was rejected (${esc(e.invalid)}), so it didn’t count toward your week.</p>${nextBtn}`) + (wm ? weekView(day, wm) : '');
  else if (wm && e) { m.innerHTML = lockedCourt(day, e) + weekView(day, wm); return; }
  else if (wm) body = sat + weekView(day, wm);
  else if (!e) body = sat;
  else body = notice('Locked in', 'Finding your opponent', `<p>Lineups locked at ${timeLabel(day.lockAt)}. Your opponent for the week is set on the next sync, within 30 minutes of tip-off, and both lineups are revealed then.</p>`);
  keepRacesScroll(() => { m.innerHTML = `<section class="streak" id="streak">${streakBanner()}</section>${heroCard(day)}${body}`; });
}

/* ---------- Edits ---------- */
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

let saveTimer = null, saving = false, saveAgain = false;
function changed() {
  ui.save = 'pending'; renderCourt(); renderLineup(); renderSide();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 700);
}
// An entry exists only while the lineup is complete; emptying a slot withdraws it.
async function flush() {
  if (saving) { saveAgain = true; return; }
  const date = ui.draftFor, day = days.get(date), ids = ui.draft.slice();
  if (!day || locked(day)) { ui.save = 'err'; toast('Lineups are locked for this slate.'); render(); return; }
  saving = true;
  const ref = db.doc(`entries/${date}_${me.id}`);
  try {
    // Boosters ride along on the entry, one per filled slot; the sync applies and uses them up at lock.
    const boosts = Object.fromEntries(Object.entries(ui.draftBoosts).filter(([i, bid]) => ids[+i] && boosters.some(b => b.id === bid)));
    if (ready(ids, day)) await ref.set({ uid: me.id, date, ids, at: Date.now(), ...(Object.keys(boosts).length ? { boosts } : {}) });
    else if (entries.has(date)) await ref.delete();
    ui.save = 'ok';
  } catch (err) { ui.save = 'err'; }
  saving = false;
  if (saveAgain) { saveAgain = false; return flush(); }
  if (ui.draftFor === date && $('#lineup')) renderLineup();
}

function addPlayer(id) {
  const day = days.get(ui.sel), lu = ui.draft, p = pmap(day).get(id);
  if (!p || lu.includes(id)) return;
  if (!owns(id)) return toast(`You don’t have a ${p.name} card.`);
  let i = SLOTS.findIndex((s, k) => s === p.pos && !lu[k]);
  if (i < 0 && !lu[5]) i = 5;
  if (i < 0) return toast(`Your ${p.pos} slots and UTIL are full. Remove someone first.`);
  if (isOut(p)) toast(`${p.name} is listed as out. Out players score 0.`);
  lu[i] = id; changed();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  // Tapping anything outside the open menu, or any item in it, closes it.
  if (ui.menu && !(b && b.dataset.action === 'menu') && (!e.target.closest('#menu') || b)) { ui.menu = false; renderTop(); }
  if (!b || b.disabled) return;
  const a = b.dataset.action;
  if (a === 'sel') { ui.view = 'night'; ui.sel = b.dataset.d; ui.open = null; ui.sig = ''; render(); window.scrollTo({ top: 0 }); }
  else if (a === 'view') {
    ui.view = b.dataset.v;
    if (ui.view === 'leaders') watchLeaders();
    // Live scores follow ui.sel, so point it at the night on show when that night is one of the loaded ones.
    if (ui.view === 'matchup') { const mm = muWeek(), d = mm && muNight(mm); if (d && days.has(d)) ui.sel = d; }
    ui.sig = ''; render(); window.scrollTo({ top: 0 });
  }
  else if (a === 'mu-open') { ui.view = 'matchup'; ui.muNight = b.dataset.d; ui.sig = ''; render(); window.scrollTo({ top: 0 }); }
  else if (a === 'mu-night') { ui.muNight = b.dataset.d; if (days.has(ui.muNight)) ui.sel = ui.muNight; ui.sig = ''; render(); }
  else if (a === 'mu-cats') { ui.muCats = b.dataset.s; ui.sig = ''; render(); }
  else if (a === 'sheet') setSheet(!document.body.classList.contains('sheet-open'));
  else if (a === 'sheet-close') setSheet(false);
  else if (a === 'player') { if ($('#cardview').open) $('#cardview').close(); openPlayer(b.dataset.id); }
  else if (a === 'cv-close') $('#cardview').close();
  else if (a === 'avatar-pick') $('#avatar-file').click();
  else if (a === 'avatar-remove') saveProfile({ avatar: firebase.firestore.FieldValue.delete() }, 'Picture removed.');
  else if (a === 'feature') saveProfile({ featuredBadge: b.dataset.id === profile.featuredBadge ? firebase.firestore.FieldValue.delete() : b.dataset.id });
  else if (a === 'pclose') $('#pcard').close();
  else if (a === 'signout') auth.signOut();
  else if (a === 'auth-reset') { ui.auth = ''; render(); }
  else if (a === 'edit-name') { ui.editName = true; ui.sig = ''; render(); }
  else if (a === 'name-cancel') { ui.editName = false; ui.sig = ''; render(); }
  else if (a === 'menu') { ui.menu = !ui.menu; renderTop(); }
  else if (a === 'pack') openPack('starter');
  else if (a === 'flip') flipNext();
  else if (a === 'flip-all') { const st = curStack(); if (st) { st.i = st.items.length; finishStack(); } }
  else if (a === 'buy') openPack(b.dataset.t);
  else if (a === 'gift') openPack(b.dataset.t, true);
  else if (a === 'reveal-done') { ui.packReveal = null; ui.sig = ''; render(); }
  else if (a === 'sell') sellCards([b.dataset.id]);
  else if (a === 'sell-dupes') sellCards([...document.querySelectorAll('[data-action=sell]')].map(x => x.dataset.id));
  else if (a === 'lvl-pick') { ui.lvlPick = b.dataset.s; refreshPlayer(); }
  else if (a === 'lvl-go') levelUp(b.dataset.pid, ui.lvlPick);
  else if (a === 'sell-one') {
    if (b.dataset.last === 'true' && ui.sellConfirm !== b.dataset.id) { ui.sellConfirm = b.dataset.id; openPlayer(b.dataset.pid); return; }
    $('#pcard').close(); sellCards([b.dataset.id]);
  }
  else if (a === 'pack-done') { ui.reveal = null; ui.sig = ''; render(); window.scrollTo({ top: 0 }); }
  else if (a === 'card-pos') { ui.cardPos = b.dataset.v; ui.sig = ''; render(); }
  else if (a === 'toggle-row') { ui.open = ui.open === b.dataset.k ? '' : b.dataset.k; ui.sig = ''; render(); }
  else if (!ui.draft || !days.get(ui.sel) || locked(days.get(ui.sel))) return;
  else if (a === 'add') addPlayer(b.dataset.id);
  else if (a === 'drop') { const at = ui.draft.indexOf(b.dataset.id); ui.draft[at] = null; delete ui.draftBoosts[at]; changed(); }
  else if (a === 'remove') { ui.draft[+b.dataset.i] = null; delete ui.draftBoosts[+b.dataset.i]; changed(); }
  else if (a === 'clear') { ui.draft = SLOTS.map(() => null); ui.draftBoosts = {}; changed(); }
  else if (a === 'boost') {
    // One booster per card: putting it here takes it off any other card.
    const i = +b.dataset.i;
    for (const k of Object.keys(ui.draftBoosts)) if (ui.draftBoosts[k] === b.dataset.id) delete ui.draftBoosts[k];
    ui.draftBoosts[i] = b.dataset.id; changed(); openPicker(i);
  }
  else if (a === 'unboost') { delete ui.draftBoosts[+b.dataset.i]; changed(); openPicker(+b.dataset.i); }
  else if (a === 'auto') {
    const day = days.get(ui.sel), base = ui.draft.map(id => id && owns(id) ? id : null);
    const r = buildLineup(ownedPool(day), { base, noise: 0.05, noCaptain: true, partial: true });
    if (!r || r.ids.filter(Boolean).length <= base.filter(Boolean).length) return toast('None of your other cards fit the open slots.');
    ui.draft = r.ids; changed();
  }
  else if (a === 'slot') openPicker(+b.dataset.i);
  else if (a === 'pick') {
    const i = ui.pickSlot, id = b.dataset.id, lu = ui.draft;
    if (i == null || !owns(id)) return;
    const at = lu.indexOf(id);
    if (at >= 0) lu[at] = null;
    // A booster stays with the card it was put on, so it leaves a spot when that card does.
    if (at >= 0) { if (ui.draftBoosts[at] != null) ui.draftBoosts[i] = ui.draftBoosts[at]; else delete ui.draftBoosts[i]; delete ui.draftBoosts[at]; }
    else delete ui.draftBoosts[i];
    lu[i] = id; $('#pcard').close(); changed();
  }
  else if (a === 'unslot') { ui.draft[+b.dataset.i] = null; delete ui.draftBoosts[+b.dataset.i]; $('#pcard').close(); changed(); }
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const btn = e.target.querySelector('[type=submit]');
  btn.disabled = true;
  try {
    const f = e.target.id;
    if (f === 'signin-form') {
      const email = $('#signin-email').value.trim();
      await auth.sendSignInLinkToEmail(email, { url: location.origin + location.pathname, handleCodeInApp: true });
      try { localStorage.setItem(EMAIL_KEY, email); } catch (err) {}
      ui.auth = 'sent'; ui.authEmail = email; render();
    } else if (f === 'confirm-form') {
      await finishSignIn($('#confirm-email').value.trim());
    } else if (f === 'name-form') {
      const name = $('#name-input').value.trim().replace(/\s+/g, ' '), err = $('#name-err');
      if (!/^[A-Za-z0-9_ .-]{3,16}$/.test(name)) { err.textContent = 'Use 3–16 letters, numbers, spaces, dots, dashes or underscores.'; return; }
      const taken = await db.collection('users').where('nameLower', '==', name.toLowerCase()).limit(1).get();
      if (taken.docs.some(d => d.id !== me.id)) { err.textContent = 'That name is taken. Try another.'; return; }
      const ref = db.doc('users/' + me.id);
      if (profile) await ref.update({ name, nameLower: name.toLowerCase() });
      else await ref.set({ name, nameLower: name.toLowerCase(), createdAt: Date.now() });
      ui.editName = false; ui.sig = '';
    }
  } catch (err) {
    toast(err.code === 'auth/invalid-email' ? 'That email address doesn’t look right.'
      : err.code === 'auth/operation-not-allowed' ? 'Email sign-in isn’t switched on in Firebase yet. See README step 2.'
      : 'That didn’t save. Check your connection and try again.');
  } finally { btn.disabled = false; }
});

document.addEventListener('input', e => {

  if (e.target.id === 'name-input') $('#name-err').textContent = '';
});
document.addEventListener('change', e => {

  if (e.target.id === 'avatar-file' && e.target.files[0]) uploadAvatar(e.target.files[0]);
});

/* ---------- Boot (Firebase) ---------- */
const EMAIL_KEY = 'bo7-signin-email';
let unsubGroup = null, groupKey = '', unsubLeaders = null;

// US Eastern calendar date, offset by whole days, as YYYYMMDD (NBA game days are Eastern dates).
function etDay(offset = 0) {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' })
    .format(new Date(Date.now() + offset * 864e5)).replace(/-/g, '');
}

function fail(err) {
  const denied = err && err.code === 'permission-denied';
  $('#main').innerHTML = notice('Error', denied ? 'The database refused the request' : 'Couldn’t load the game', denied
    ? '<p>Check that the Firestore security rules from <b>firestore.rules</b> are published in the Firebase console.</p>'
    : '<p>Reload the page to try again.</p>');
}

function watchGroup() {
  const e = entries.get(ui.sel), key = e?.group ? `${ui.sel}/${e.group}` : '';
  if (key === groupKey) return;
  groupKey = key; unsubGroup?.(); group = null;
  if (!key) return;
  unsubGroup = db.doc(`days/${ui.sel}/groups/${e.group}`).onSnapshot(s => { group = s.exists ? s.data() : null; ui.sig = ''; render(); }, () => {});
}

function watchLeaders() {
  if (unsubLeaders) return;
  unsubLeaders = db.collection('users').orderBy('rp', 'desc').limit(50)
    .onSnapshot(s => { leaders = s.docs.map(d => ({ id: d.id, ...d.data() })); if (ui.view === 'leaders') { ui.sig = ''; render(); } }, () => {});
}

/* ---------- Player profile ---------- */
const ESPN_ATHLETE = 'https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba/athletes';
const profiles = new Map();
let pcardFor = null, pcardData = null;

function fetchProfile(id) {
  if (!profiles.has(id)) {
    const json = u => fetch(u).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
    profiles.set(id, Promise.all([json(`${ESPN_ATHLETE}/${id}`), json(`${ESPN_ATHLETE}/${id}/gamelog`)])
      .catch(err => { profiles.delete(id); throw err; }));
  }
  return profiles.get(id);
}

// The player's latest regular-season and playoff games, newest first.
function lastGames(log, n = 5) {
  const L = log.labels || [], rows = [];
  for (const st of log.seasonTypes || []) {
    if (/preseason/i.test(st.displayName || '')) continue;
    for (const c of st.categories || []) {
      for (const ev of c.events || []) {
        const info = log.events?.[ev.eventId];
        if (!info) continue;
        const num = k => parseFloat(ev.stats[L.indexOf(k)]) || 0;
        const line = [num('MIN'), num('PTS'), num('REB'), num('AST'), num('STL'), num('BLK'), num('TO')];
        rows.push({ date: info.gameDate, opp: `${info.atVs || ''} ${info.opponent?.abbreviation || ''}`.trim(), result: info.gameResult || '', score: info.score || '', line, fp: fpOf(line) });
      }
    }
  }
  return rows.sort((a, b) => Date.parse(b.date) - Date.parse(a.date)).slice(0, n);
}

function describe(a, p) {
  const pos = (a.position?.displayName || POS_NAME[p?.pos] || 'player').toLowerCase();
  const team = a.team?.displayName || p?.team;
  const lines = [`${a.displayName} is a ${a.age ? a.age + '-year-old ' : ''}${pos}${team ? ` for the ${team}` : ''}${a.displayExperience ? `, in his ${a.displayExperience.toLowerCase()}` : ''}.`];
  if (a.displayDraft) lines.push(`Drafted ${a.displayDraft}.`);
  if (a.displayBirthPlace) lines.push(`Born in ${a.displayBirthPlace}.`);
  return lines.join(' ');
}

function gamesTable(games) {
  if (!games.length) return '<p class="empty">No regular-season games yet this season.</p>';
  const cols = ['MIN', 'PTS', 'REB', 'AST', 'STL', 'BLK', 'TO'];
  const avg = i => f1(games.reduce((s, g) => s + g.line[i], 0) / games.length);
  return `<div class="tablewrap"><table class="pc-games">
    <thead><tr><th>Game</th><th>Result</th>${cols.map(c => `<th class="r">${c}</th>`).join('')}<th class="r">FP</th></tr></thead>
    <tbody>${games.map(g => `<tr><td><b>${new Date(g.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</b> <span class="pc-dim">${esc(g.opp)}</span></td>
      <td class="pc-res ${g.result === 'W' ? 'w' : g.result === 'L' ? 'l' : ''}">${esc(g.result)} <span class="pc-dim">${esc(g.score)}</span></td>
      ${g.line.map(v => `<td class="r num">${v}</td>`).join('')}<td class="r num"><b>${f1(g.fp)}</b></td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="2">Average</td>${cols.map((_, i) => `<td class="r num">${avg(i)}</td>`).join('')}<td class="r num">${f1(games.reduce((s, g) => s + g.fp, 0) / games.length)}</td></tr></tfoot>
  </table></div>`;
}

function renderPlayer(id, p, data, failed) {
  setTimeout(updateScrollCues, 0);
  const a = data?.[0]?.athlete, name = a?.displayName || p?.name || 'Player';
  const day = days.get(ui.sel);
  const canEdit = ui.view === 'night' && ui.draft && day && !locked(day) && p && owns(id);
  const inLu = canEdit && ui.draft.includes(id);
  const meta = a ? [a.displayJersey, a.position?.displayName, a.team?.displayName, a.displayHeight, a.displayWeight].filter(Boolean).join(' · ') : p ? `${p.team} · ${POS_NAME[p.pos] || ''}` : '';
  $('#pcard').innerHTML = `
    <button class="pc-x" data-action="pclose" aria-label="Close">✕</button>
    <div class="pc-head">
      <div class="pc-photo"><img src="https://a.espncdn.com/i/headshots/nba/players/full/${encodeURIComponent(id)}.png" alt="" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span hidden>${jersey(p?.team || '')}</span></div>
      <div class="pc-title"><h2 id="pc-name">${esc(name)}</h2><p class="pc-meta">${esc(meta)}</p>
        ${p || roster.has(id) ? `<div class="pc-tags">${owns(id) ? `<span class="rar r-${rarityOf(id)}">${RARITY[rarityOf(id)].name} card</span>` : '<span class="chip">Not in your collection</span>'}${typeChips((p || roster.get(id)).types)}${starsHtml((p || roster.get(id)).stars)}${p?.gp ? `<span class="chip">FPPG ${f1(p.avg)}</span>` : ''}${p && isOut(p) ? '<span class="inj out">Out</span>' : p && isGtd(p) ? `<span class="inj gtd">${esc(p.status)}</span>` : ''}${p?.opp ? `<span class="chip">${esc(p.opp)}</span>` : ''}</div>` : ''}
      </div>
    </div>
    ${failed ? '<p class="empty">Couldn’t load this player’s profile from ESPN. Close this and tap the player to try again.</p>'
      : !data ? '<p class="empty">Loading profile…</p>'
      : `<p class="pc-bio">${esc(describe(a, p))}</p><h3>Last 5 games</h3>${gamesTable(lastGames(data[1]))}`}
    ${canEdit ? `<div class="pc-foot"><button class="btn ${inLu ? '' : 'primary'}" data-action="${inLu ? 'drop' : 'add'}" data-id="${esc(id)}" data-pclose>${inLu ? 'Remove from lineup' : `Add to lineup · ${p.stars}★`}</button></div>` : ''}
    ${owns(id) ? levelFoot(id) : ''}
    ${sellFoot(id)}
    <p class="pc-src">Photo and stats: ESPN</p>`;
}
// Redraws the open profile in place (after a level-up or new cards), keeping the ESPN data already loaded.
function refreshPlayer() {
  if (!pcardFor || !$('#pcard').open) return;
  const p = pmap(days.get(ui.sel) || { players: [] }).get(pcardFor) || (roster.has(pcardFor) ? { ...roster.get(pcardFor), opp: '' } : undefined);
  renderPlayer(pcardFor, p, pcardData);
}

function openPlayer(id) {
  const dlg = $('#pcard'), p = pmap(days.get(ui.sel) || { players: [] }).get(id) || (roster.has(id) ? { ...roster.get(id), opp: '' } : undefined);
  if (pcardFor !== id) { ui.sellConfirm = null; ui.lvlPick = null; pcardData = null; }
  pcardFor = id;
  renderPlayer(id, p, pcardData);
  if (!dlg.open) dlg.showModal();
  fetchProfile(id).then(d => { if (pcardFor === id) { pcardData = d; renderPlayer(id, p, d); } }, () => { if (pcardFor === id) renderPlayer(id, p, null, true); });
}

document.addEventListener('click', e => {
  const dlg = $('#pcard');
  if (e.target === dlg || e.target.closest('[data-pclose]')) { dlg.close(); return; }
  const cv = $('#cardview');
  if (e.target === cv) { cv.close(); return; }
  if (e.target.closest('button, a, input, select')) return;
  // A Weekly Star opens its enlarged view; other cards open the player's profile.
  const star = e.target.closest('.sc');
  if (star && !star.closest('#cardview')) { openCardView(star); return; }
  if (e.target.closest('#cardview')) return;
  const row = e.target.closest('[data-pid]');
  if (row) openPlayer(row.dataset.pid);
});

/* ---------- Live scores ---------- */
// GitHub can run the scheduled sync hours late, so an open page reads game scores straight from ESPN.
// This only changes what's shown: official finishes and rank points still come from the sync.
const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba';
const live = new Map(), boxCache = new Map();
let rawDays = new Map(), liveBusy = false, liveSel = null;

// Mirrors boxLines in sync/nba-sync.mjs: { athleteId: [min, pts, reb, ast, stl, blk, to, threes, fgm, fga, ftm] }
function boxLines(box) {
  const out = {};
  for (const t of box.boxscore?.players || []) {
    const st = t.statistics?.[0];
    if (!st) continue;
    const L = st.labels || st.names;
    for (const a of st.athletes || []) {
      if (a.didNotPlay || !a.stats || !a.stats.length) continue;
      const n = k => { const v = parseFloat(a.stats[L.indexOf(k)]); return isNaN(v) ? 0 : v; };
      // "FG" reads "7-15": made, then attempted.
      const att = k => { const v = parseFloat(String(a.stats[L.indexOf(k)] ?? '').split('-')[1]); return isNaN(v) ? 0 : v; };
      out[a.athlete.id] = [n('MIN'), n('PTS'), n('REB'), n('AST'), n('STL'), n('BLK'), n('TO'), n('3PT'), n('FG'), att('FG'), n('FT')];
    }
  }
  return out;
}

function withLive(doc) {
  const l = live.get(doc.date);
  return !l || doc.final ? doc : { ...doc, games: l.games, results: { ...doc.results, ...l.results }, final: l.final, updatedAt: l.at };
}
const applyLive = () => { days = new Map([...rawDays].map(([k, d]) => [k, withLive(d)])); };

async function pollLive() {
  const doc = rawDays.get(ui.sel);
  if (liveBusy || document.hidden || (ui.view !== 'night' && ui.view !== 'matchup') || !doc || doc.final || !locked(doc)) return;
  liveBusy = true;
  try {
    const sb = await (await fetch(`${ESPN}/scoreboard?dates=${doc.date}`)).json();
    const events = new Map(sb.events.map(e => [e.id, e]));
    const results = {};
    const games = await Promise.all(doc.games.map(async g => {
      const e = events.get(g.id);
      if (!e) return g;
      const c = e.competitions[0], status = e.status.type.name;
      const score = side => +c.competitors.find(x => x.homeAway === side).score || 0;
      if (status !== 'STATUS_SCHEDULED') {
        let lines = boxCache.get(g.id);
        if (!lines) {
          lines = boxLines(await (await fetch(`${ESPN}/summary?event=${g.id}`)).json());
          if (LIVE_DONE.has(status)) boxCache.set(g.id, lines);
        }
        Object.assign(results, lines);
      }
      return { ...g, status, detail: e.status.type.shortDetail, awayScore: score('away'), homeScore: score('home') };
    }));
    live.set(doc.date, { games, results, final: games.every(g => LIVE_DONE.has(g.status)), at: new Date().toISOString() });
    applyLive();
    render();
  } catch (e) { /* keep showing the last synced numbers */ } finally { liveBusy = false; }
}

function startData() {
  db.doc('users/' + me.id).onSnapshot(s => { profile = s.exists ? s.data() : null; loaded.profile = true; ui.sig = ''; render(); }, fail);
  db.collection('entries').where('uid', '==', me.id)
    .onSnapshot(s => { entries = new Map(s.docs.map(x => [x.data().date, x.data()])); loaded.entries = true; render(); }, () => { loaded.entries = true; render(); });
  db.collection(`users/${me.id}/cards`).onSnapshot(s => {
    allCards = s.docs.map(d => ({ id: d.id, ...d.data() }));
    const by = new Map();
    for (const c of allCards) { if (!by.has(c.pid)) by.set(c.pid, []); by.get(c.pid).push(c); }
    cards = new Map([...by].map(([pid, list]) => [pid, bestOf(list)]));
    loaded.cards = true; ui.sig = ''; render(); refreshPlayer();
  }, () => { loaded.cards = true; render(); });
  db.collection(`users/${me.id}/boosters`).onSnapshot(s => {
    boosters = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name));
    ui.sig = ''; render();
  }, () => {});
  // Every weekly matchup the player has been in, newest first.
  db.collection('matches').where('uids', 'array-contains', me.id).onSnapshot(s => {
    myMatches = s.docs.map(d => d.data()).sort((a, b) => a.week < b.week ? 1 : -1);
    render();
  }, () => {});
  db.doc('meta/roster').get().then(s => { roster = new Map((s.exists ? s.data().players : []).map(p => [p.id, p])); rosterStars = s.exists ? s.data().stars || null : null; ui.sig = ''; render(); }, () => {});
}

async function finishSignIn(email) {
  try {
    await auth.signInWithEmailLink(email, location.href);
    try { localStorage.removeItem(EMAIL_KEY); } catch (e) {}
  } catch (e) {
    toast('That sign-in link has expired or was already used. Request a new one.');
  }
  ui.auth = '';
  history.replaceState({}, '', location.pathname);
}

async function boot() {
  const cfg = window.FIREBASE_CONFIG;
  if (!window.firebase || !cfg || !cfg.apiKey || /^PASTE/.test(cfg.apiKey)) {
    $('#main').innerHTML = notice('Setup needed', 'Add your Firebase config', '<p>Open <b>config.js</b> and paste your Firebase web app config. README.md walks through it.</p>');
    return;
  }
  firebase.initializeApp(cfg);
  auth = firebase.auth();
  db = firebase.firestore();
  db.collection('days').where(firebase.firestore.FieldPath.documentId(), '>=', etDay(-3)).limit(6)
    .onSnapshot(s => { rawDays = new Map(s.docs.map(x => [x.id, x.data()])); applyLive(); loaded.days = true; render(); }, fail);
  if (auth.isSignInWithEmailLink(location.href)) {
    let email = null;
    try { email = localStorage.getItem(EMAIL_KEY); } catch (e) {}
    if (email) await finishSignIn(email); else ui.auth = 'confirm';
  }
  auth.onAuthStateChanged(u => {
    if (!u && me.id) { location.reload(); return; }
    me = { id: u ? u.uid : null, email: u?.email || '' };
    loaded.auth = true;
    ui.sig = '';
    if (u) startData();
    render();
  });
  // Re-render each minute so countdowns tick and slates lock on time.
  setInterval(() => { if (ui.sig.startsWith('build|') && days.get(ui.sel) && locked(days.get(ui.sel))) ui.sig = ''; render(); pollLive(); }, 60000);
  document.addEventListener('visibilitychange', pollLive);
}
boot();
</script>
